# Book-level super-graph — AUTO-GENERATED, do not edit by hand.
# Run:  python scripts/build_super_graph.py
#
# Merges all chapter graphs; each node carries source_domain (canonical
# definition) and optionally also_in (other chapters that reuse it).
# Cross-domain primitives (concepts in an earlier chapter re-declared as
# primitives in a later one) appear here with their full composed_of chain.
# This file is never used for SPL generation — it exists for validation
# and future book-level graph visualisation.
domain: chemistry
chapters:
- chemistry_ch01
- chemistry_ch02
- chemistry_ch03
- chemistry_ch04
- chemistry_ch05
- chemistry_ch06
- chemistry_ch07
- chemistry_ch08
- chemistry_ch09
- chemistry_ch10
- chemistry_ch11
- chemistry_ch12
- chemistry_ch13
- chemistry_ch14
- chemistry_ch15
- chemistry_ch16
- chemistry_ch17
- chemistry_ch18
- chemistry_ch19
- chemistry_ch20
- chemistry_ch21
primitives:
  matter:
    defines: Anything that occupies space and has mass, existing as solids, liquids,
      gases, or plasma.
    tier: 0
    source_domain: chemistry_ch01
    also_in:
    - chemistry_ch02
  mass:
    defines: A fundamental property indicating the amount of matter in an object,
      independent of gravity.
    tier: 0
    source_domain: chemistry_ch01
    also_in:
    - chemistry_ch02
  energy:
    defines: A primitive quantity whose interactions with matter drive physical and
      chemical changes; assumed as background knowledge in this chapter.
    tier: 0
    source_domain: chemistry_ch01
    also_in:
    - chemistry_ch05
  hypothesis:
    defines: A tentative explanation of observations that acts as a guide for gathering
      and checking information.
    tier: 0
    source_domain: chemistry_ch01
  measurement:
    defines: A quantitative determination that provides a number, a unit of comparison,
      and an indication of uncertainty.
    tier: 0
    source_domain: chemistry_ch01
  scientific_notation:
    defines: A method of representing numbers as a coefficient multiplied by a power
      of ten, used to express very large or very small quantities.
    tier: 0
    source_domain: chemistry_ch01
  electric_charge:
    defines: A fundamental physical property of matter (positive or negative) that
      determines electromagnetic interactions.
    tier: 0
    source_domain: chemistry_ch02
    also_in:
    - chemistry_ch17
  chemical_bond:
    defines: An attractive force between atoms or ions that holds them together in
      a molecule or crystal.
    tier: 0
    source_domain: chemistry_ch02
  atomic_mass:
    defines: The average mass of an atom of an element in atomic mass units (amu),
      treated as a given starting point from which formula masses are computed.
    tier: 0
    source_domain: chemistry_ch03
  mole:
    defines: An amount unit equal to 6.022 × 10²³ discrete entities, providing a bridge
      between the macroscopic mass of a sample and the microscopic count of its atoms
      or molecules.
    tier: 0
    source_domain: chemistry_ch03
    also_in:
    - chemistry_ch04
  avogadros_number:
    defines: The experimentally determined constant 6.022 × 10²³ mol⁻¹ representing
      the number of entities in exactly one mole of substance.
    tier: 0
    source_domain: chemistry_ch03
    also_in:
    - chemistry_ch04
  solvent:
    defines: The solution component present at the highest relative concentration,
      in which all other components are dispersed.
    tier: 0
    source_domain: chemistry_ch03
  solute:
    defines: A solution component present at a lower concentration than the solvent,
      dispersed or dissolved throughout the solution.
    tier: 0
    source_domain: chemistry_ch03
  chemical_equation:
    defines: A symbolic representation of a chemical reaction showing reactant formulas
      on the left and product formulas on the right, separated by an arrow.
    tier: 0
    source_domain: chemistry_ch04
  reactant:
    defines: A substance consumed in a chemical reaction, represented on the left
      side of a chemical equation.
    tier: 0
    source_domain: chemistry_ch04
  product:
    defines: A substance formed in a chemical reaction, represented on the right side
      of a chemical equation.
    tier: 0
    source_domain: chemistry_ch04
  coefficient:
    defines: A whole number placed before a formula in a chemical equation indicating
      the relative number of that species involved in the reaction.
    tier: 0
    source_domain: chemistry_ch04
  acid:
    defines: A substance that dissolves in water to yield hydronium ions (H₃O⁺).
    tier: 0
    source_domain: chemistry_ch04
  base:
    defines: A substance that dissolves in water to yield hydroxide ions (OH⁻).
    tier: 0
    source_domain: chemistry_ch04
  actual_yield:
    defines: The measured amount of product actually obtained from a reaction, which
      is typically less than the theoretical yield due to competing reactions, incomplete
      reactions, or losses during collection.
    tier: 0
    source_domain: chemistry_ch04
  oxidation_number:
    defines: The hypothetical charge an atom would carry in a compound if the compound
      were ionic, assigned according to a set of standard rules.
    tier: 0
    source_domain: chemistry_ch04
    also_in:
    - chemistry_ch17
    - chemistry_ch20
  kinetic_energy:
    defines: Energy that an object possesses because of its motion, equal to one-half
      the product of mass and the square of velocity.
    tier: 0
    source_domain: chemistry_ch05
  potential_energy:
    defines: Energy an object has because of its relative position, composition, or
      condition.
    tier: 0
    source_domain: chemistry_ch05
  work:
    defines: Energy transfer caused by a force moving matter against an opposing force,
      or by changes in macroscopic variables such as pressure and volume.
    tier: 0
    source_domain: chemistry_ch05
  wave:
    defines: An oscillation or periodic movement that can transport energy from one
      point in space to another without net displacement of matter.
    tier: 0
    source_domain: chemistry_ch06
  wavelength:
    defines: The distance between two consecutive peaks or troughs in a wave, denoted
      by λ and measured in meters.
    tier: 0
    source_domain: chemistry_ch06
  frequency:
    defines: The number of wave cycles that pass a specified point in space per unit
      time, denoted by ν and measured in hertz (Hz).
    tier: 0
    source_domain: chemistry_ch06
  amplitude:
    defines: The magnitude of a wave's displacement, related to the intensity (brightness
      for light, loudness for sound).
    tier: 0
    source_domain: chemistry_ch06
  speed_of_light:
    defines: The constant speed at which electromagnetic radiation travels through
      a vacuum, c = 2.998 × 10⁸ m/s.
    tier: 0
    source_domain: chemistry_ch06
  planck_constant:
    defines: A fundamental physical constant h = 6.626 × 10⁻³⁴ J·s that relates the
      energy of a photon to its frequency.
    tier: 0
    source_domain: chemistry_ch06
  electromagnetic_radiation:
    defines: Energy transmitted by waves composed of oscillating electric and magnetic
      fields perpendicular to each other and to the direction of travel.
    tier: 0
    source_domain: chemistry_ch06
    also_in:
    - chemistry_ch21
  noble_gas_configuration:
    defines: A filled valence shell electron arrangement, used as the stable reference
      state for ion and bond formation.
    tier: 0
    source_domain: chemistry_ch07
  periodic_table_trends:
    defines: Systematic variation of atomic properties across periods and down groups.
    tier: 0
    source_domain: chemistry_ch07
  electrostatic_force:
    defines: The force of attraction or repulsion between electrically charged particles,
      governed by Coulomb's law.
    tier: 0
    source_domain: chemistry_ch07
    also_in:
    - chemistry_ch10
  atomic_orbitals:
    defines: Regions of space around an isolated atom (s, p, d) where electrons are
      likely to be found, characterized by shape and energy.
    tier: 0
    source_domain: chemistry_ch08
  wave_function:
    defines: A mathematical expression that describes the wavelike properties and
      probability distribution of an electron in an atom or molecule.
    tier: 0
    source_domain: chemistry_ch08
  force:
    defines: A push or pull on an object, measured in newtons; a fundamental physical
      quantity assumed as given in this chapter.
    tier: 0
    source_domain: chemistry_ch09
  area:
    defines: The extent of a two-dimensional surface, treated as a known geometric
      quantity used in defining pressure.
    tier: 0
    source_domain: chemistry_ch09
  temperature_kelvin:
    defines: A measurable property of matter reflecting thermal energy; the Kelvin
      scale sets zero at absolute zero and is required for all gas law calculations.
    tier: 0
    source_domain: chemistry_ch09
  amount_of_substance:
    defines: The quantity of matter expressed in moles, representing a fixed number
      of particles; assumed from prior chemistry study.
    tier: 0
    source_domain: chemistry_ch09
  molecular_volume:
    defines: The nonzero physical size of real gas molecules, treated as a given physical
      fact when explaining deviations from ideal behavior.
    tier: 0
    source_domain: chemistry_ch09
  polarity_and_dipole_moment:
    defines: A property of molecules with an asymmetric charge distribution resulting
      in partial positive and negative ends, assumed from prior bonding chapters.
    tier: 0
    source_domain: chemistry_ch10
  specific_heat:
    defines: The amount of heat required to raise the temperature of one gram of a
      substance by one degree Celsius, used as a given quantity from thermochemistry.
    tier: 0
    source_domain: chemistry_ch10
  polarity:
    defines: The uneven distribution of electron density in a molecule, determining
      its ability to interact with ions and other polar molecules.
    tier: 0
    source_domain: chemistry_ch11
  ions:
    defines: Charged atomic or molecular species formed by gain or loss of electrons,
      treated as given entities throughout this chapter.
    tier: 0
    source_domain: chemistry_ch11
  molar_concentration:
    defines: The amount of a substance expressed in moles per liter of solution, used
      as the primary measure of reactant and product quantities in kinetics.
    tier: 0
    source_domain: chemistry_ch12
  reversible_reaction:
    defines: A chemical reaction that can proceed in both the forward and reverse
      directions under given conditions.
    tier: 0
    source_domain: chemistry_ch13
  proton_transfer:
    defines: Movement of H+ from a donor to an acceptor species; mechanistic basis
      of Brønsted-Lowry acid-base reactions.
    tier: 0
    source_domain: chemistry_ch14
  hydronium_ion:
    defines: The H3O+ cation formed when water accepts a proton; characteristic acid
      species in aqueous solution.
    tier: 0
    source_domain: chemistry_ch14
  hydroxide_ion:
    defines: The OH− anion formed when water donates a proton; characteristic base
      species in aqueous solution.
    tier: 0
    source_domain: chemistry_ch14
  chemical_equilibrium:
    defines: Dynamic state where forward and reverse reaction rates are equal, characterized
      by an equilibrium constant expression.
    tier: 0
    source_domain: chemistry_ch14
    also_in:
    - chemistry_ch15
  le_chateliers_principle:
    defines: A system at equilibrium shifts to oppose any imposed stress; used to
      explain perturbation of aqueous equilibria by added acids or bases.
    tier: 0
    source_domain: chemistry_ch14
    also_in:
    - chemistry_ch15
  ionic_dissolution:
    defines: The process by which an ionic solid dissociates into its constituent
      ions when placed in a solvent.
    tier: 0
    source_domain: chemistry_ch15
  ion_concentration:
    defines: The amount of dissolved ions expressed in moles per liter of solution.
    tier: 0
    source_domain: chemistry_ch15
  heat_flow:
    defines: The transfer of thermal energy between objects or between a system and
      its surroundings driven by a temperature difference.
    tier: 0
    source_domain: chemistry_ch16
  equilibrium:
    defines: The condition in which forward and reverse processes occur at equal rates,
      so macroscopic properties remain constant over time.
    tier: 0
    source_domain: chemistry_ch16
  electric_current:
    defines: The rate of flow of charge, measured in amperes (one coulomb per second),
      used to quantify electron flow in electrochemical cells.
    tier: 0
    source_domain: chemistry_ch17
  periodic_table_groups:
    defines: Elements are classified by which orbitals are filling (s, p, d, f), placing
      them in representative, transition metal, or inner transition metal categories.
    tier: 0
    source_domain: chemistry_ch18
  oxidation_state:
    defines: A bookkeeping number assigned to an atom representing the number of electrons
      lost, gained, or shared unequally in a compound.
    tier: 0
    source_domain: chemistry_ch18
    also_in:
    - chemistry_ch19
  ionic_bonding:
    defines: A chemical bond formed by electrostatic attraction between oppositely
      charged ions, typically between metals and nonmetals.
    tier: 0
    source_domain: chemistry_ch18
  covalent_bonding:
    defines: A chemical bond formed by sharing of electron pairs between atoms, typical
      of nonmetal-nonmetal combinations.
    tier: 0
    source_domain: chemistry_ch18
  lewis_acid_base:
    defines: A Lewis acid is an electron-pair acceptor and a Lewis base is an electron-pair
      donor; extends acid-base behavior beyond proton transfer.
    tier: 0
    source_domain: chemistry_ch18
  reduction_potential:
    defines: A measure of the tendency of a species to be reduced; elements with lower
      reduction potentials than hydrogen are oxidized by acids to release H2 gas.
    tier: 0
    source_domain: chemistry_ch18
    also_in:
    - chemistry_ch19
  lewis_acid_base_interaction:
    defines: A chemical interaction in which a Lewis base donates an electron pair
      to a Lewis acid acceptor.
    tier: 0
    source_domain: chemistry_ch19
  paramagnetism_diamagnetism:
    defines: Paramagnetism is the attraction of a substance to a magnetic field due
      to unpaired electrons; diamagnetism is the slight repulsion of a substance with
      no unpaired electrons.
    tier: 0
    source_domain: chemistry_ch19
  organic_compound:
    defines: A natural or synthetic compound that contains carbon as the principal
      element, typically bonded to hydrogen and other carbon atoms.
    tier: 0
    source_domain: chemistry_ch20
  carbon_tetravalence:
    defines: The capacity of carbon atoms to form up to four strong covalent bonds,
      enabling the construction of chains, branches, and rings of varying size and
      complexity.
    tier: 0
    source_domain: chemistry_ch20
  resonance_structure:
    defines: One of two or more equivalent Lewis structures for a molecule whose actual
      bonding is an intermediate (hybrid) of all contributing structures, used to
      describe delocalized electrons in aromatic systems.
    tier: 0
    source_domain: chemistry_ch20
  mass_energy_equivalence:
    defines: Einstein's relation E = mc² expressing that mass and energy are interconvertible,
      used to calculate energy released in nuclear processes from mass defect.
    tier: 0
    source_domain: chemistry_ch21
concepts:
  chemistry:
    defines: The study of the composition, properties, and interactions of matter.
    composed_of:
    - matter
    tier: 1
    source_domain: chemistry_ch01
  macroscopic_domain:
    defines: The realm of everyday things large enough to be sensed directly by human
      sight or touch, where physical and chemical properties are observed and measured.
    composed_of:
    - matter
    tier: 1
    source_domain: chemistry_ch01
  states_of_matter:
    defines: The distinct physical forms matter takes—solid, liquid, and gas—each
      with characteristic shape and volume behavior.
    composed_of:
    - matter
    tier: 1
    source_domain: chemistry_ch01
  weight:
    defines: The force that gravity exerts on an object, directly proportional to
      its mass but varying with gravitational field strength.
    composed_of:
    - mass
    tier: 1
    source_domain: chemistry_ch01
  molecule:
    defines: A bonded collection of two or more atoms of the same or different elements
      that move as a unit.
    composed_of:
    - atom
    tier: 1
    source_domain: chemistry_ch01
  physical_property:
    defines: A characteristic of matter not associated with a change in its chemical
      composition, such as density, color, or melting point.
    composed_of:
    - matter
    tier: 1
    source_domain: chemistry_ch01
  chemical_property:
    defines: A characteristic related to a substance's ability or inability to change
      into a different kind of matter, such as flammability or reactivity.
    composed_of:
    - matter
    tier: 1
    source_domain: chemistry_ch01
  pure_substance:
    defines: Matter with a constant, uniform composition throughout; classified as
      either an element or a compound.
    composed_of:
    - matter
    tier: 1
    source_domain: chemistry_ch01
  scientific_law:
    defines: A statement that summarizes a vast number of experimental observations
      and describes or predicts some facet of the natural world.
    composed_of:
    - hypothesis
    tier: 2
    source_domain: chemistry_ch01
  microscopic_domain:
    defines: The realm of entities too small to sense directly, including atoms, ions,
      electrons, and molecules.
    composed_of:
    - atom
    - molecule
    tier: 2
    source_domain: chemistry_ch01
  plasma:
    defines: A fourth state of matter consisting of a gas that contains appreciable
      numbers of electrically charged particles, found in stars and high-temperature
      environments.
    composed_of:
    - states_of_matter
    tier: 2
    source_domain: chemistry_ch01
  element:
    defines: A pure substance composed of a single type of atom that cannot be broken
      down into simpler substances by chemical changes.
    composed_of:
    - pure_substance
    tier: 2
    source_domain: chemistry_ch01
    also_in:
    - chemistry_ch02
  mixture:
    defines: Matter composed of two or more types of substances that can be present
      in varying amounts and separated by physical means.
    composed_of:
    - matter
    - pure_substance
    tier: 2
    source_domain: chemistry_ch01
  physical_change:
    defines: A change in the state or properties of matter that does not involve any
      change in the chemical identities of the substances present.
    composed_of:
    - matter
    - physical_property
    tier: 2
    source_domain: chemistry_ch01
  chemical_change:
    defines: A change that always produces one or more types of matter that differ
      from the matter present before the change.
    composed_of:
    - matter
    - chemical_property
    tier: 2
    source_domain: chemistry_ch01
  extensive_property:
    defines: A property of matter whose value depends on the amount of matter present,
      such as mass or volume.
    composed_of:
    - physical_property
    - mass
    tier: 2
    source_domain: chemistry_ch01
  intensive_property:
    defines: A property of matter that is independent of the amount of matter present,
      such as temperature or density.
    composed_of:
    - physical_property
    tier: 2
    source_domain: chemistry_ch01
  si_units:
    defines: The International System of Units, a set of seven base units fixed by
      international agreement used as standards for scientific measurement.
    composed_of:
    - measurement
    tier: 2
    source_domain: chemistry_ch01
  exact_number:
    defines: A number derived by counting or by definition that carries no measurement
      uncertainty.
    composed_of:
    - measurement
    tier: 2
    source_domain: chemistry_ch01
  measurement_uncertainty:
    defines: The estimate of the amount by which a measured value may differ from
      the true value, inherent in all non-counting measurements.
    composed_of:
    - measurement
    tier: 2
    source_domain: chemistry_ch01
  accuracy:
    defines: The closeness of a measurement to the true or accepted value of the quantity
      being measured.
    composed_of:
    - measurement
    tier: 2
    source_domain: chemistry_ch01
  precision:
    defines: The degree to which repeated measurements of the same quantity yield
      similar results.
    composed_of:
    - measurement
    tier: 2
    source_domain: chemistry_ch01
  scientific_theory:
    defines: A well-substantiated, comprehensive, testable explanation of a particular
      aspect of nature developed from confirmed hypotheses.
    composed_of:
    - hypothesis
    - scientific_law
    tier: 3
    source_domain: chemistry_ch01
  symbolic_domain:
    defines: The specialized language of chemistry—symbols, formulas, equations, and
      calculations—used to represent components of the macroscopic and microscopic
      domains.
    composed_of:
    - macroscopic_domain
    - microscopic_domain
    tier: 3
    source_domain: chemistry_ch01
  compound:
    defines: A pure substance composed of two or more elements chemically combined
      in fixed ratios, decomposable by chemical changes.
    composed_of:
    - element
    - pure_substance
    tier: 3
    source_domain: chemistry_ch01
  heterogeneous_mixture:
    defines: A mixture whose composition varies from point to point throughout the
      sample.
    composed_of:
    - mixture
    tier: 3
    source_domain: chemistry_ch01
  homogeneous_mixture:
    defines: A mixture that exhibits a uniform composition and appears visually the
      same throughout.
    composed_of:
    - mixture
    tier: 3
    source_domain: chemistry_ch01
  law_of_conservation_of_matter:
    defines: The principle stating that the total quantity of matter present does
      not change detectably when matter converts between types or physical states.
    composed_of:
    - matter
    - scientific_law
    tier: 3
    source_domain: chemistry_ch01
    also_in:
    - chemistry_ch02
    - chemistry_ch04
  volume:
    defines: A derived SI quantity measuring the amount of three-dimensional space
      occupied by an object, expressed in cubic meters or liters.
    composed_of:
    - measurement
    - si_units
    tier: 3
    source_domain: chemistry_ch01
    also_in:
    - chemistry_ch09
  temperature:
    defines: An intensive property representing the hotness or coldness of matter,
      measured in kelvin (SI), Celsius, or Fahrenheit.
    composed_of:
    - intensive_property
    - si_units
    tier: 3
    source_domain: chemistry_ch01
    also_in:
    - chemistry_ch05
    - chemistry_ch12
    - chemistry_ch13
    - chemistry_ch16
  si_prefixes:
    defines: Standardized prefix modifiers (e.g., kilo-, milli-, micro-) that denote
      powers of ten applied to SI base units.
    composed_of:
    - si_units
    - scientific_notation
    tier: 3
    source_domain: chemistry_ch01
  significant_figures:
    defines: All of the measured digits in a quantity, including the last uncertain
      digit, used to convey the precision of a measurement.
    composed_of:
    - measurement_uncertainty
    - precision
    tier: 3
    source_domain: chemistry_ch01
  dimensional_analysis:
    defines: A mathematical approach in which units are treated as algebraic quantities
      enabling unit conversions and multi-step calculations.
    composed_of:
    - measurement
    - si_units
    tier: 3
    source_domain: chemistry_ch01
  scientific_method:
    defines: The path of discovery from question and observation through hypothesis
      and theory, combined with experimental verification.
    composed_of:
    - hypothesis
    - scientific_law
    - scientific_theory
    tier: 4
    source_domain: chemistry_ch01
  density:
    defines: An intensive property defined as the ratio of a substance's mass to its
      volume.
    composed_of:
    - mass
    - volume
    - intensive_property
    tier: 4
    source_domain: chemistry_ch01
    also_in:
    - chemistry_ch09
  rounding:
    defines: A procedure applied to calculated results to ensure the reported value
      reflects the uncertainty of the least certain measurement used.
    composed_of:
    - significant_figures
    - measurement_uncertainty
    tier: 4
    source_domain: chemistry_ch01
  unit_conversion_factor:
    defines: A ratio of two equivalent quantities expressed in different units, used
      to convert a measurement from one unit to another via dimensional analysis.
    composed_of:
    - dimensional_analysis
    tier: 4
    source_domain: chemistry_ch01
  daltons_atomic_theory:
    defines: A set of postulates stating that matter is composed of indivisible atoms,
      each element has one unique atom type, atoms combine in fixed whole-number ratios,
      and atoms are conserved in chemical changes.
    composed_of:
    - matter
    - element
    tier: 1
    source_domain: chemistry_ch02
  law_of_definite_proportions:
    defines: All samples of a pure compound contain the same elements in the same
      proportions by mass.
    composed_of:
    - matter
    - element
    - mass
    tier: 1
    source_domain: chemistry_ch02
  law_of_multiple_proportions:
    defines: When two elements react to form more than one compound, a fixed mass
      of one element reacts with masses of the other in a ratio of small whole numbers.
    composed_of:
    - element
    - mass
    tier: 1
    source_domain: chemistry_ch02
  chemical_symbol:
    defines: A one-, two-, or three-letter abbreviation used to represent an element
      or its atoms in chemical notation.
    composed_of:
    - element
    tier: 1
    source_domain: chemistry_ch02
  atom:
    defines: The smallest unit of an element that can participate in a chemical change,
      as defined by Dalton's atomic theory.
    composed_of:
    - daltons_atomic_theory
    - element
    tier: 2
    source_domain: chemistry_ch02
    also_in:
    - chemistry_ch01
  electron:
    defines: A negatively charged subatomic particle of very low mass found outside
      the nucleus, discovered via cathode ray experiments by Thomson.
    composed_of:
    - atom
    - electric_charge
    tier: 3
    source_domain: chemistry_ch02
    also_in:
    - chemistry_ch21
  proton:
    defines: A positively charged subatomic particle found in the nucleus with a mass
      of approximately 1 amu, identified by Rutherford.
    composed_of:
    - atom
    - electric_charge
    tier: 3
    source_domain: chemistry_ch02
    also_in:
    - chemistry_ch21
  neutron:
    defines: An uncharged subatomic particle found in the nucleus with a mass approximately
      equal to a proton, discovered by Chadwick in 1932.
    composed_of:
    - atom
    tier: 3
    source_domain: chemistry_ch02
    also_in:
    - chemistry_ch21
  atomic_mass_unit:
    defines: A unit of mass defined as exactly 1/12 of the mass of a carbon-12 atom,
      equal to 1.6605 × 10⁻²⁴ g.
    composed_of:
    - mass
    - atom
    tier: 3
    source_domain: chemistry_ch02
  molecular_formula:
    defines: A chemical notation using element symbols and subscripts to indicate
      the exact number of each type of atom in a molecule or compound.
    composed_of:
    - atom
    - chemical_symbol
    tier: 3
    source_domain: chemistry_ch02
    also_in:
    - chemistry_ch03
  nucleus:
    defines: The small, dense, positively charged center of an atom containing protons
      and neutrons, surrounded by a much larger region of electrons.
    composed_of:
    - proton
    - neutron
    tier: 4
    source_domain: chemistry_ch02
  mass_number:
    defines: The sum of the numbers of protons and neutrons in the nucleus of an atom.
    composed_of:
    - proton
    - neutron
    tier: 4
    source_domain: chemistry_ch02
    also_in:
    - chemistry_ch21
  ion:
    defines: An electrically charged atom or molecule that results from gaining or
      losing electrons, giving it unequal numbers of protons and electrons.
    composed_of:
    - atom
    - electron
    tier: 4
    source_domain: chemistry_ch02
    also_in:
    - chemistry_ch07
  empirical_formula:
    defines: A formula showing the simplest whole-number ratio of atoms of each element
      present in a compound.
    composed_of:
    - molecular_formula
    tier: 4
    source_domain: chemistry_ch02
    also_in:
    - chemistry_ch03
  structural_formula:
    defines: A representation showing the types, numbers, and bonding connections
      of atoms within a molecule.
    composed_of:
    - molecular_formula
    - chemical_bond
    tier: 4
    source_domain: chemistry_ch02
  covalent_bond:
    defines: An attractive force formed when two atoms share one or more pairs of
      electrons, typically between nonmetal atoms.
    composed_of:
    - atom
    - electron
    tier: 4
    source_domain: chemistry_ch02
    also_in:
    - chemistry_ch07
    - chemistry_ch08
  atomic_number:
    defines: The number of protons in the nucleus of an atom, which uniquely identifies
      the element.
    composed_of:
    - proton
    - nucleus
    tier: 5
    source_domain: chemistry_ch02
    also_in:
    - chemistry_ch21
  cation:
    defines: A positively charged ion formed when an atom loses one or more electrons.
    composed_of:
    - ion
    tier: 5
    source_domain: chemistry_ch02
  anion:
    defines: A negatively charged ion formed when an atom gains one or more electrons.
    composed_of:
    - ion
    tier: 5
    source_domain: chemistry_ch02
  isomers:
    defines: Compounds that share the same molecular formula but differ in the arrangement
      or spatial orientation of their atoms, resulting in different chemical properties.
    composed_of:
    - molecular_formula
    - structural_formula
    tier: 5
    source_domain: chemistry_ch02
  molecular_compound:
    defines: A compound composed of discrete, neutral molecules in which atoms are
      held together by covalent bonds, typically formed from two or more nonmetals.
    composed_of:
    - covalent_bond
    - molecular_formula
    tier: 5
    source_domain: chemistry_ch02
  polyatomic_ion:
    defines: An electrically charged molecule consisting of two or more bonded atoms
      that acts as a single discrete unit in ionic compounds.
    composed_of:
    - ion
    - covalent_bond
    tier: 5
    source_domain: chemistry_ch02
  isotope:
    defines: Atoms of the same element that have the same number of protons but different
      numbers of neutrons, and thus different mass numbers.
    composed_of:
    - atomic_number
    - neutron
    tier: 6
    source_domain: chemistry_ch02
    also_in:
    - chemistry_ch21
  periodic_law:
    defines: The properties of elements are periodic functions of their atomic numbers,
      forming the basis for organizing the periodic table.
    composed_of:
    - element
    - atomic_number
    tier: 6
    source_domain: chemistry_ch02
  ionic_bond:
    defines: An electrostatic force of attraction between oppositely charged ions
      formed by electron transfer from a metal to a nonmetal.
    composed_of:
    - cation
    - anion
    tier: 6
    source_domain: chemistry_ch02
    also_in:
    - chemistry_ch07
  average_atomic_mass:
    defines: The weighted average of the masses of all naturally occurring isotopes
      of an element, calculated using each isotope's mass and fractional abundance.
    composed_of:
    - isotope
    - atomic_mass_unit
    tier: 7
    source_domain: chemistry_ch02
  periodic_table:
    defines: An arrangement of elements in order of increasing atomic number into
      rows (periods) and columns (groups) such that elements with similar chemical
      properties appear in the same group.
    composed_of:
    - periodic_law
    tier: 7
    source_domain: chemistry_ch02
  ionic_compound:
    defines: A compound composed of cations and anions held together by ionic bonds,
      generally formed from a metal and a nonmetal, and electrically neutral overall.
    composed_of:
    - ionic_bond
    tier: 7
    source_domain: chemistry_ch02
    also_in:
    - chemistry_ch07
  element_classification:
    defines: A categorization of elements based on shared physical and chemical properties,
      where metals are shiny and conductive, nonmetals are dull and poor conductors,
      and metalloids exhibit intermediate properties.
    composed_of:
    - periodic_table
    - element
    tier: 8
    source_domain: chemistry_ch02
  element_families:
    defines: Named sets of elements occupying the same periodic table column that
      share similar chemical behaviors, such as alkali metals (group 1), alkaline
      earth metals (group 2), halogens (group 17), and noble gases (group 18).
    composed_of:
    - periodic_table
    tier: 8
    source_domain: chemistry_ch02
  formula_mass:
    defines: The sum of the average atomic masses of all atoms represented in a chemical
      formula, expressed in amu.
    composed_of:
    - atomic_mass
    tier: 1
    source_domain: chemistry_ch03
  aqueous_solution:
    defines: A solution in which water is the solvent.
    composed_of:
    - solution
    - solvent
    tier: 1
    source_domain: chemistry_ch03
  concentration:
    defines: A quantitative measure of the relative amount of solute present in a
      given amount of solution.
    composed_of:
    - solution
    - solute
    tier: 1
    source_domain: chemistry_ch03
    also_in:
    - chemistry_ch13
  molecular_mass:
    defines: The formula mass of a covalent compound, equal to the sum of average
      atomic masses of all atoms in one molecule.
    composed_of:
    - formula_mass
    tier: 2
    source_domain: chemistry_ch03
  molar_mass:
    defines: The mass in grams of one mole of a substance, numerically equivalent
      to its formula mass in amu, expressed in g/mol.
    composed_of:
    - formula_mass
    - mole
    tier: 2
    source_domain: chemistry_ch03
    also_in:
    - chemistry_ch04
    - chemistry_ch09
  percent_composition:
    defines: The mass percentage of each element in a compound, calculated by dividing
      each element's mass contribution by the compound's total formula mass and multiplying
      by 100.
    composed_of:
    - atomic_mass
    - formula_mass
    tier: 2
    source_domain: chemistry_ch03
  molarity:
    defines: A concentration unit defined as the number of moles of solute dissolved
      in exactly one liter of solution, with units of mol/L (M).
    composed_of:
    - concentration
    - mole
    tier: 2
    source_domain: chemistry_ch03
    also_in:
    - chemistry_ch04
    - chemistry_ch11
  dilution:
    defines: The process of decreasing solution concentration by adding solvent, increasing
      total volume while keeping moles of solute constant.
    composed_of:
    - concentration
    - solvent
    tier: 2
    source_domain: chemistry_ch03
  mass_percentage:
    defines: A concentration unit expressing the ratio of solute mass to total solution
      mass as a percentage.
    composed_of:
    - concentration
    tier: 2
    source_domain: chemistry_ch03
  volume_percentage:
    defines: A concentration unit expressing the ratio of solute volume to total solution
      volume as a percentage, commonly used for liquid solutes dissolved in liquid
      solvents.
    composed_of:
    - concentration
    tier: 2
    source_domain: chemistry_ch03
  mass_volume_percentage:
    defines: A mixed concentration unit expressing the ratio of solute mass to solution
      volume as a percentage, widely used in biochemical and medical contexts.
    composed_of:
    - concentration
    tier: 2
    source_domain: chemistry_ch03
  parts_per_million:
    defines: A concentration unit equal to the ratio of solute mass to solution mass
      multiplied by 10⁶, used to express trace-level concentrations of solutes such
      as environmental contaminants.
    composed_of:
    - concentration
    tier: 2
    source_domain: chemistry_ch03
  parts_per_billion:
    defines: A concentration unit equal to the ratio of solute mass to solution mass
      multiplied by 10⁹, used for very low trace-level concentrations below the practical
      range of ppm.
    composed_of:
    - concentration
    tier: 2
    source_domain: chemistry_ch03
  empirical_formula_mass:
    defines: The sum of the average atomic masses of all atoms represented in an empirical
      formula, used to scale the empirical formula up to the molecular formula.
    composed_of:
    - empirical_formula
    - atomic_mass
    tier: 4
    source_domain: chemistry_ch03
  balanced_equation:
    defines: A chemical equation in which the number of atoms of each element is equal
      on the reactant and product sides, consistent with conservation of matter.
    composed_of:
    - law_of_conservation_of_matter
    - chemical_equation
    - coefficient
    tier: 1
    source_domain: chemistry_ch04
  molecular_equation:
    defines: A chemical equation in which all reactants and products are written as
      neutral (undissociated) formulas.
    composed_of:
    - chemical_equation
    - reactant
    - product
    tier: 1
    source_domain: chemistry_ch04
  precipitation_reaction:
    defines: A reaction in which dissolved reactants form one or more insoluble solid
      products (precipitates) that separate from solution.
    composed_of:
    - solubility
    - reactant
    - product
    tier: 1
    source_domain: chemistry_ch04
  strong_acid:
    defines: An acid that reacts completely when dissolved in water, converting essentially
      all dissolved molecules to hydronium ions.
    composed_of:
    - acid
    tier: 1
    source_domain: chemistry_ch04
  weak_acid:
    defines: An acid that only partially ionizes when dissolved in water, leaving
      most molecules in their un-ionized form.
    composed_of:
    - acid
    tier: 1
    source_domain: chemistry_ch04
  strong_base:
    defines: A base that completely dissociates when dissolved in water to yield hydroxide
      ions.
    composed_of:
    - base
    tier: 1
    source_domain: chemistry_ch04
  weak_base:
    defines: A base that only partially reacts with water to yield hydroxide ions,
      leaving most dissolved molecules unreacted.
    composed_of:
    - base
    tier: 1
    source_domain: chemistry_ch04
  acid_base_reaction:
    defines: A chemical reaction in which a hydrogen ion (H⁺) is transferred from
      one species (the acid) to another (the base).
    composed_of:
    - acid
    - base
    tier: 1
    source_domain: chemistry_ch04
  complete_ionic_equation:
    defines: A chemical equation in which all dissolved ionic species, including spectator
      ions, are explicitly shown in dissociated form.
    composed_of:
    - molecular_equation
    tier: 2
    source_domain: chemistry_ch04
  neutralization_reaction:
    defines: A specific acid-base reaction in which an acid and a base react to produce
      a salt and, typically, water.
    composed_of:
    - acid_base_reaction
    tier: 2
    source_domain: chemistry_ch04
  solubility_rules:
    defines: A set of empirical guidelines used to predict whether an ionic compound
      will dissolve or precipitate when dissolved ionic compounds are combined in
      aqueous solution.
    composed_of:
    - solubility
    - precipitation_reaction
    tier: 2
    source_domain: chemistry_ch04
  oxidation:
    defines: The process by which an element's oxidation number increases, corresponding
      to the loss of electrons.
    composed_of:
    - oxidation_number
    tier: 2
    source_domain: chemistry_ch04
    also_in:
    - chemistry_ch17
  reduction:
    defines: The process by which an element's oxidation number decreases, corresponding
      to the gain of electrons.
    composed_of:
    - oxidation_number
    tier: 2
    source_domain: chemistry_ch04
    also_in:
    - chemistry_ch17
  stoichiometry:
    defines: The quantitative relationships between the amounts of reactants consumed
      and products formed in a chemical reaction, derived from the coefficients of
      a balanced equation.
    composed_of:
    - balanced_equation
    - mole
    tier: 2
    source_domain: chemistry_ch04
    also_in:
    - chemistry_ch12
    - chemistry_ch13
  spectator_ion:
    defines: An ion present in a reaction mixture that undergoes no chemical or physical
      change and is omitted from the net ionic equation.
    composed_of:
    - complete_ionic_equation
    tier: 3
    source_domain: chemistry_ch04
  redox_reaction:
    defines: A reaction in which one or more elements undergo a change in oxidation
      number, involving the transfer of electrons between species.
    composed_of:
    - oxidation
    - reduction
    tier: 3
    source_domain: chemistry_ch04
    also_in:
    - chemistry_ch17
  stoichiometric_factor:
    defines: A ratio of coefficients from a balanced chemical equation used as a conversion
      factor to relate molar amounts of any two species in the reaction.
    composed_of:
    - stoichiometry
    tier: 3
    source_domain: chemistry_ch04
  limiting_reactant:
    defines: The reactant present in a sub-stoichiometric amount relative to other
      reactants, which determines the maximum amount of product that can form.
    composed_of:
    - stoichiometry
    tier: 3
    source_domain: chemistry_ch04
  equivalence_point:
    defines: The point in a titration at which the titrant has been added in exactly
      the stoichiometric amount required to completely react with the analyte.
    composed_of:
    - stoichiometry
    tier: 3
    source_domain: chemistry_ch04
    also_in:
    - chemistry_ch14
  quantitative_analysis:
    defines: Any method for determining the amount or concentration of a substance
      in a sample, often relying on known reaction stoichiometry.
    composed_of:
    - stoichiometry
    - molarity
    tier: 3
    source_domain: chemistry_ch04
  net_ionic_equation:
    defines: A chemical equation derived from the complete ionic equation by removing
      spectator ions, showing only the species that actually undergo chemical change.
    composed_of:
    - complete_ionic_equation
    - spectator_ion
    tier: 4
    source_domain: chemistry_ch04
  oxidizing_agent:
    defines: A substance that causes oxidation of another species and is itself reduced
      in the process.
    composed_of:
    - redox_reaction
    tier: 4
    source_domain: chemistry_ch04
  reducing_agent:
    defines: A substance that causes reduction of another species and is itself oxidized
      in the process.
    composed_of:
    - redox_reaction
    tier: 4
    source_domain: chemistry_ch04
  half_reaction_method:
    defines: A systematic procedure for balancing redox equations by separately balancing
      the oxidation and reduction half-reactions before combining them.
    composed_of:
    - redox_reaction
    - balanced_equation
    tier: 4
    source_domain: chemistry_ch04
    also_in:
    - chemistry_ch17
  single_displacement_reaction:
    defines: A redox reaction in which an elemental substance is oxidized and displaces
      an ion of another element from solution.
    composed_of:
    - redox_reaction
    tier: 4
    source_domain: chemistry_ch04
  excess_reactant:
    defines: A reactant present in an amount greater than required by the reaction
      stoichiometry, so some remains unreacted after the limiting reactant is consumed.
    composed_of:
    - limiting_reactant
    - stoichiometry
    tier: 4
    source_domain: chemistry_ch04
  theoretical_yield:
    defines: The maximum amount of product that could be produced from given reactant
      quantities according to the balanced equation stoichiometry.
    composed_of:
    - limiting_reactant
    - stoichiometry
    tier: 4
    source_domain: chemistry_ch04
  percent_yield:
    defines: A measure of reaction efficiency calculated as the ratio of actual yield
      to theoretical yield, expressed as a percentage.
    composed_of:
    - theoretical_yield
    - actual_yield
    tier: 5
    source_domain: chemistry_ch04
  thermal_energy:
    defines: Kinetic energy associated with the random motion of atoms and molecules
      in a substance.
    composed_of:
    - kinetic_energy
    tier: 1
    source_domain: chemistry_ch05
  law_of_conservation_of_energy:
    defines: During any chemical or physical change, energy can be neither created
      nor destroyed, only converted from one form to another.
    composed_of:
    - energy
    tier: 1
    source_domain: chemistry_ch05
  system_and_surroundings:
    defines: The conceptual division of the universe into the portion of matter undergoing
      change (system) and all other matter that can exchange energy with it (surroundings).
    composed_of:
    - energy
    tier: 1
    source_domain: chemistry_ch05
  heat:
    defines: The transfer of thermal energy between two bodies at different temperatures,
      flowing spontaneously from the hotter body to the cooler one.
    composed_of:
    - thermal_energy
    - temperature
    tier: 2
    source_domain: chemistry_ch05
  internal_energy:
    defines: The total of all possible kinds of energy present in a substance, including
      translational, vibrational, and rotational kinetic energy of its atoms and molecules.
    composed_of:
    - thermal_energy
    tier: 2
    source_domain: chemistry_ch05
  expansion_work:
    defines: Work done when a system expands or contracts against an external pressure,
      equal in magnitude but opposite in sign to the product PΔV.
    composed_of:
    - work
    - system_and_surroundings
    tier: 2
    source_domain: chemistry_ch05
  exothermic_process:
    defines: A chemical reaction or physical change that releases heat to the surroundings,
      giving a negative heat value (q < 0).
    composed_of:
    - heat
    tier: 3
    source_domain: chemistry_ch05
  endothermic_process:
    defines: A chemical reaction or physical change that absorbs heat from the surroundings,
      giving a positive heat value (q > 0).
    composed_of:
    - heat
    tier: 3
    source_domain: chemistry_ch05
  heat_capacity:
    defines: An extensive property representing the quantity of heat a body of matter
      absorbs or releases when its temperature changes by 1 degree Celsius.
    composed_of:
    - heat
    - temperature
    tier: 3
    source_domain: chemistry_ch05
  thermal_equilibrium:
    defines: The state reached when two bodies in thermal contact arrive at the same
      temperature and net heat flow between them ceases.
    composed_of:
    - heat
    - temperature
    tier: 3
    source_domain: chemistry_ch05
  first_law_of_thermodynamics:
    defines: The internal energy of a system changes according to ΔU = q + w, where
      energy is conserved across all heat flow and work exchanges with surroundings.
    composed_of:
    - internal_energy
    - heat
    - work
    - law_of_conservation_of_energy
    tier: 3
    source_domain: chemistry_ch05
  state_function:
    defines: A property whose value depends only on the current state of a system
      and not on the path taken to reach that state.
    composed_of:
    - internal_energy
    tier: 3
    source_domain: chemistry_ch05
    also_in:
    - chemistry_ch16
  specific_heat_capacity:
    defines: An intensive property representing the quantity of heat required to raise
      the temperature of 1 gram of a substance by 1 degree Celsius.
    composed_of:
    - heat_capacity
    tier: 4
    source_domain: chemistry_ch05
  calorimetry:
    defines: The experimental technique of measuring the amount of heat transferred
      in a chemical or physical process by recording temperature changes in a calibrated
      device.
    composed_of:
    - heat_capacity
    - thermal_equilibrium
    tier: 4
    source_domain: chemistry_ch05
  enthalpy:
    defines: A state function defined as H = U + PV that equals the heat exchanged
      during a process occurring at constant pressure with only expansion work.
    composed_of:
    - internal_energy
    - state_function
    - expansion_work
    tier: 4
    source_domain: chemistry_ch05
    also_in:
    - chemistry_ch16
  heat_transfer_equation:
    defines: The mathematical relationship q = mcΔT that quantifies heat absorbed
      or released by a substance from its mass, specific heat, and temperature change.
    composed_of:
    - specific_heat_capacity
    tier: 5
    source_domain: chemistry_ch05
  coffee_cup_calorimeter:
    defines: A simple constant-pressure calorimeter constructed from insulating cups
      used to measure heat flow in solution-phase reactions.
    composed_of:
    - calorimetry
    tier: 5
    source_domain: chemistry_ch05
  bomb_calorimeter:
    defines: A constant-volume calorimeter consisting of a sealed steel vessel submerged
      in water, used to measure heat released by combustion reactions.
    composed_of:
    - calorimetry
    tier: 5
    source_domain: chemistry_ch05
  enthalpy_change:
    defines: The heat absorbed or released by a system at constant pressure (ΔH =
      qp), negative for exothermic and positive for endothermic processes.
    composed_of:
    - enthalpy
    - heat
    tier: 5
    source_domain: chemistry_ch05
    also_in:
    - chemistry_ch13
  thermochemical_equation:
    defines: A balanced chemical equation that includes the associated enthalpy change
      (ΔH) for the reaction as written, with physical states of all species specified.
    composed_of:
    - enthalpy_change
    tier: 6
    source_domain: chemistry_ch05
  standard_state:
    defines: A reference set of conditions (1 bar pressure, 1 M for solutions, typically
      298.15 K) used to report thermodynamic properties consistently.
    composed_of:
    - enthalpy_change
    tier: 6
    source_domain: chemistry_ch05
  standard_enthalpy_of_combustion:
    defines: The enthalpy change when exactly 1 mole of a substance undergoes complete
      combustion under standard state conditions.
    composed_of:
    - enthalpy_change
    - standard_state
    tier: 7
    source_domain: chemistry_ch05
  standard_enthalpy_of_formation:
    defines: The enthalpy change for a reaction in which exactly 1 mole of a pure
      substance is formed from its elements in their most stable standard states.
    composed_of:
    - enthalpy_change
    - standard_state
    tier: 7
    source_domain: chemistry_ch05
  hess_law:
    defines: The principle that the total enthalpy change of a process equals the
      sum of enthalpy changes of any series of steps that produce the same overall
      change, because enthalpy is a state function.
    composed_of:
    - enthalpy_change
    - state_function
    - thermochemical_equation
    tier: 7
    source_domain: chemistry_ch05
  wave_speed_equation:
    defines: The relationship c = λν, stating that the speed of a wave equals the
      product of its wavelength and frequency.
    composed_of:
    - wavelength
    - frequency
    - speed_of_light
    tier: 1
    source_domain: chemistry_ch06
  electromagnetic_spectrum:
    defines: The continuous range of all electromagnetic radiation ordered by frequency
      and wavelength, from radio waves through microwaves, infrared, visible, ultraviolet,
      X-rays, and gamma rays.
    composed_of:
    - electromagnetic_radiation
    - frequency
    - wavelength
    tier: 1
    source_domain: chemistry_ch06
  interference:
    defines: The superposition of two or more waves producing regions of constructive
      interference (peaks align) or destructive interference (peaks cancel troughs).
    composed_of:
    - wave
    - amplitude
    tier: 1
    source_domain: chemistry_ch06
  standing_wave:
    defines: A localized wave phenomenon constrained within a region of space such
      that only an integer number of half-wavelengths fits between the fixed endpoints,
      making the wavelengths inherently quantized.
    composed_of:
    - wave
    - wavelength
    - interference
    tier: 2
    source_domain: chemistry_ch06
  continuous_spectrum:
    defines: Electromagnetic radiation emitted over an unbroken series of wavelengths,
      as produced by heated solids, liquids, or dense gases.
    composed_of:
    - electromagnetic_radiation
    - electromagnetic_spectrum
    tier: 2
    source_domain: chemistry_ch06
  quantization:
    defines: The restriction of a physical property (such as energy or wavelength)
      to discrete allowed values rather than a continuous range.
    composed_of:
    - standing_wave
    tier: 3
    source_domain: chemistry_ch06
  blackbody_radiation:
    defines: The characteristic continuous spectrum of electromagnetic radiation emitted
      by an idealized perfect absorber/emitter, whose spectral distribution depends
      only on temperature.
    composed_of:
    - electromagnetic_radiation
    - continuous_spectrum
    tier: 3
    source_domain: chemistry_ch06
  photon:
    defines: The smallest discrete packet (quantum) of electromagnetic radiation,
      whose energy is given by E = hν.
    composed_of:
    - electromagnetic_radiation
    - planck_constant
    - quantization
    tier: 4
    source_domain: chemistry_ch06
  line_spectrum:
    defines: Electromagnetic radiation emitted at discrete, characteristic wavelengths
      by atoms or molecules in an excited gaseous state, reflecting quantized electronic
      energy levels.
    composed_of:
    - electromagnetic_radiation
    - electromagnetic_spectrum
    - quantization
    tier: 4
    source_domain: chemistry_ch06
  photon_energy:
    defines: The energy of a single photon expressed as E = hν = hc/λ, where energy
      is directly proportional to frequency and inversely proportional to wavelength.
    composed_of:
    - photon
    - wave_speed_equation
    tier: 5
    source_domain: chemistry_ch06
  rydberg_formula:
    defines: An empirical equation predicting all emission wavelengths of hydrogen
      using two integer quantum numbers n₁ and n₂ and the Rydberg constant R∞.
    composed_of:
    - line_spectrum
    - wavelength
    tier: 5
    source_domain: chemistry_ch06
  photoelectric_effect:
    defines: The ejection of electrons from a metal surface when struck by photons
      whose frequency exceeds a threshold value; kinetic energy of ejected electrons
      depends on photon frequency, not light intensity.
    composed_of:
    - photon
    - photon_energy
    tier: 6
    source_domain: chemistry_ch06
  bohr_model:
    defines: A structural model in which the electron moves in discrete circular orbits
      of quantized energy around the nucleus, emitting or absorbing a photon only
      when transitioning between orbits.
    composed_of:
    - quantization
    - photon_energy
    - line_spectrum
    - rydberg_formula
    tier: 6
    source_domain: chemistry_ch06
  wave_particle_duality:
    defines: The observation that electromagnetic radiation and quantum particles
      such as electrons exhibit both wavelike behavior (interference, diffraction)
      and particle-like behavior (discrete collisions, localized packets).
    composed_of:
    - interference
    - photon
    - photoelectric_effect
    tier: 7
    source_domain: chemistry_ch06
  energy_level:
    defines: One of the discrete, quantized energies an electron in an atom may possess,
      characterized by quantum number n, with energy increasing (becoming less negative)
      as n increases.
    composed_of:
    - bohr_model
    tier: 7
    source_domain: chemistry_ch06
  de_broglie_wavelength:
    defines: The wavelength λ = h/mv associated with any particle of mass m moving
      at velocity v, extending wave–particle duality to matter.
    composed_of:
    - wave_particle_duality
    - planck_constant
    tier: 8
    source_domain: chemistry_ch06
  ground_state:
    defines: The lowest possible energy state of an atom, in which electrons occupy
      the lowest available orbitals.
    composed_of:
    - energy_level
    tier: 8
    source_domain: chemistry_ch06
  heisenberg_uncertainty_principle:
    defines: The fundamental quantum mechanical limit stating that the position and
      momentum of a particle cannot both be determined exactly and simultaneously;
      ΔxΔp ≥ ℏ/2.
    composed_of:
    - wave_particle_duality
    - de_broglie_wavelength
    tier: 9
    source_domain: chemistry_ch06
  excited_state:
    defines: An atom's state when one or more electrons have absorbed energy and occupy
      orbitals higher than the ground state.
    composed_of:
    - energy_level
    - ground_state
    tier: 9
    source_domain: chemistry_ch06
  electronic_transition:
    defines: The movement of an electron between quantized energy levels, accompanied
      by absorption of a photon (transition to higher level) or emission of a photon
      (transition to lower level).
    composed_of:
    - energy_level
    - photon
    - ground_state
    - excited_state
    tier: 10
    source_domain: chemistry_ch06
  wavefunction:
    defines: A mathematical function that is the solution to the Schrödinger equation
      for an electron in an atom; its squared magnitude |ψ|² gives the probability
      density of finding the electron at a given location.
    composed_of:
    - wave_particle_duality
    - heisenberg_uncertainty_principle
    tier: 10
    source_domain: chemistry_ch06
  principal_quantum_number:
    defines: A positive integer (n = 1, 2, 3, …) that specifies the electron shell,
      determines the general size and energy of an orbital, and gives the average
      distance of the electron from the nucleus.
    composed_of:
    - wavefunction
    tier: 11
    source_domain: chemistry_ch06
  spin_quantum_number:
    defines: A quantum number with only two possible values (+1/2 or −1/2) describing
      the intrinsic angular momentum (spin) of an electron, a purely quantum mechanical
      property with no classical analogue.
    composed_of:
    - wavefunction
    tier: 11
    source_domain: chemistry_ch06
  angular_momentum_quantum_number:
    defines: An integer from 0 to n−1 that specifies the shape of an orbital and defines
      the subshell (l = 0 → s, l = 1 → p, l = 2 → d, l = 3 → f).
    composed_of:
    - principal_quantum_number
    tier: 12
    source_domain: chemistry_ch06
  magnetic_quantum_number:
    defines: An integer from −l to +l that specifies the spatial orientation of an
      orbital within a subshell; there are 2l + 1 possible values for each l.
    composed_of:
    - angular_momentum_quantum_number
    tier: 13
    source_domain: chemistry_ch06
  atomic_orbital:
    defines: A three-dimensional region of space around the nucleus, described by
      a wavefunction, within which an electron has the highest probability of being
      found; characterized by quantum numbers n, l, and mₗ.
    composed_of:
    - wavefunction
    - principal_quantum_number
    - angular_momentum_quantum_number
    - magnetic_quantum_number
    tier: 14
    source_domain: chemistry_ch06
  orbital_shapes:
    defines: 'The characteristic three-dimensional geometries of atomic orbitals determined
      by l: s orbitals are spherical, p orbitals are dumbbell-shaped, d orbitals are
      four-lobed or torus-shaped, and f orbitals are more complex multilobed regions.'
    composed_of:
    - atomic_orbital
    - angular_momentum_quantum_number
    tier: 15
    source_domain: chemistry_ch06
  radial_nodes:
    defines: Spherical surfaces at specific distances from the nucleus where the wavefunction—and
      therefore electron probability density—equals zero; the number of radial nodes
      equals n − l − 1.
    composed_of:
    - atomic_orbital
    - principal_quantum_number
    - angular_momentum_quantum_number
    tier: 15
    source_domain: chemistry_ch06
  pauli_exclusion_principle:
    defines: The rule that no two electrons in the same atom can share the same set
      of all four quantum numbers, limiting each orbital to a maximum of two electrons
      with opposite spins.
    composed_of:
    - atomic_orbital
    - spin_quantum_number
    tier: 15
    source_domain: chemistry_ch06
  degenerate_orbitals:
    defines: Orbitals that have the same energy; in a hydrogen atom all orbitals with
      the same n are degenerate, while in multi-electron atoms orbitals with the same
      n and l are degenerate.
    composed_of:
    - atomic_orbital
    - energy_level
    tier: 15
    source_domain: chemistry_ch06
  electron_shielding:
    defines: The reduction of the effective nuclear attraction experienced by an outer
      electron due to repulsion and partial screening by inner (core) electrons.
    composed_of:
    - atomic_orbital
    - principal_quantum_number
    tier: 15
    source_domain: chemistry_ch06
  aufbau_principle:
    defines: The procedure for building up electron configurations by filling orbitals
      in order of increasing energy (1s, 2s, 2p, 3s, 3p, 4s, 3d, …), subject to the
      Pauli exclusion principle.
    composed_of:
    - atomic_orbital
    - degenerate_orbitals
    - electron_shielding
    - pauli_exclusion_principle
    tier: 16
    source_domain: chemistry_ch06
  hunds_rule:
    defines: The rule that within a set of degenerate orbitals, the lowest-energy
      configuration has the maximum number of unpaired electrons, all with the same
      spin.
    composed_of:
    - degenerate_orbitals
    - spin_quantum_number
    tier: 16
    source_domain: chemistry_ch06
  effective_nuclear_charge:
    defines: The net positive charge experienced by a valence electron after accounting
      for shielding by inner electrons; Zeff = Z − shielding, and increases across
      a period.
    composed_of:
    - electron_shielding
    tier: 16
    source_domain: chemistry_ch06
  electron_configuration:
    defines: A notation specifying the complete occupancy of electrons in an atom's
      shells and subshells (e.g., 1s²2s²2p³), determined by applying the Aufbau principle,
      Pauli exclusion principle, and Hund's rule.
    composed_of:
    - atomic_orbital
    - aufbau_principle
    - pauli_exclusion_principle
    - hunds_rule
    tier: 17
    source_domain: chemistry_ch06
    also_in:
    - chemistry_ch07
    - chemistry_ch08
    - chemistry_ch18
    - chemistry_ch19
  covalent_radius:
    defines: One-half the distance between the nuclei of two identical atoms joined
      by a covalent bond, used as a measure of atomic size.
    composed_of:
    - effective_nuclear_charge
    - principal_quantum_number
    tier: 17
    source_domain: chemistry_ch06
  valence_electrons:
    defines: Electrons in the outermost (highest principal quantum number) shell of
      an atom; they determine chemical reactivity and are the electrons gained, lost,
      or shared in chemical reactions.
    composed_of:
    - electron_configuration
    - principal_quantum_number
    tier: 18
    source_domain: chemistry_ch06
    also_in:
    - chemistry_ch07
  core_electrons:
    defines: Electrons occupying inner shells of an atom that are not involved in
      bonding; they shield valence electrons from the full nuclear charge.
    composed_of:
    - electron_configuration
    - electron_shielding
    tier: 18
    source_domain: chemistry_ch06
  ionic_radius:
    defines: The measure of the size of an ion; cations are smaller than their parent
      atoms (fewer electrons, same nuclear charge) and anions are larger (more electrons,
      same nuclear charge).
    composed_of:
    - covalent_radius
    - electron_configuration
    tier: 18
    source_domain: chemistry_ch06
  ionization_energy:
    defines: The energy required to remove the most loosely bound electron from a
      gaseous atom or ion in its ground state; increases across a period and decreases
      down a group.
    composed_of:
    - effective_nuclear_charge
    - electron_configuration
    tier: 18
    source_domain: chemistry_ch06
    also_in:
    - chemistry_ch07
    - chemistry_ch18
  electron_affinity:
    defines: The energy change when a gaseous atom accepts an additional electron
      to form an anion; generally becomes more negative (more exothermic) moving left
      to right across a period.
    composed_of:
    - effective_nuclear_charge
    - electron_configuration
    tier: 18
    source_domain: chemistry_ch06
    also_in:
    - chemistry_ch07
  electronegativity:
    defines: A dimensionless measure of an atom's tendency to attract the shared electrons
      in a chemical bond toward itself, increasing across a period and decreasing
      down a group.
    composed_of:
    - electron_configuration
    - periodic_table_trends
    tier: 1
    source_domain: chemistry_ch07
    also_in:
    - chemistry_ch10
    - chemistry_ch18
  lewis_symbol:
    defines: An elemental symbol surrounded by dots representing each valence electron
      of the atom or monatomic ion.
    composed_of:
    - valence_electrons
    tier: 1
    source_domain: chemistry_ch07
  bond_polarity:
    defines: The degree of charge asymmetry in a covalent bond, determined by the
      electronegativity difference between the two bonded atoms.
    composed_of:
    - covalent_bond
    - electronegativity
    tier: 2
    source_domain: chemistry_ch07
  lone_pair:
    defines: A pair of valence electrons on an atom that is not involved in bonding
      with another atom.
    composed_of:
    - valence_electrons
    - covalent_bond
    tier: 2
    source_domain: chemistry_ch07
  single_bond:
    defines: A covalent bond formed by the sharing of one pair of electrons between
      two atoms.
    composed_of:
    - covalent_bond
    tier: 2
    source_domain: chemistry_ch07
  double_bond:
    defines: A covalent bond formed by the sharing of two pairs of electrons between
      two atoms, shorter and stronger than a single bond between the same atoms.
    composed_of:
    - covalent_bond
    tier: 2
    source_domain: chemistry_ch07
  triple_bond:
    defines: A covalent bond formed by the sharing of three pairs of electrons between
      two atoms, the shortest and strongest bond order between the same two atoms.
    composed_of:
    - covalent_bond
    tier: 2
    source_domain: chemistry_ch07
  bond_length:
    defines: The equilibrium internuclear distance between two bonded atoms at which
      potential energy is minimized, decreasing as bond order increases.
    composed_of:
    - covalent_bond
    tier: 2
    source_domain: chemistry_ch07
  pure_covalent_bond:
    defines: A covalent bond between identical atoms in which the bonding electrons
      are shared equally and no charge separation occurs.
    composed_of:
    - covalent_bond
    - bond_polarity
    tier: 3
    source_domain: chemistry_ch07
  polar_covalent_bond:
    defines: A covalent bond between atoms of different electronegativities in which
      bonding electrons are shared unequally, creating partial positive and negative
      charges.
    composed_of:
    - covalent_bond
    - bond_polarity
    tier: 3
    source_domain: chemistry_ch07
  lewis_structure:
    defines: A diagram depicting the arrangement of bonding pairs and lone pairs of
      valence electrons in a molecule or polyatomic ion.
    composed_of:
    - lewis_symbol
    - lone_pair
    - covalent_bond
    tier: 3
    source_domain: chemistry_ch07
    also_in:
    - chemistry_ch08
  bond_energy:
    defines: The energy required to break one mole of a specific covalent bond in
      gaseous molecules, which increases with bond order and decreases with bond length.
    composed_of:
    - covalent_bond
    - bond_length
    tier: 3
    source_domain: chemistry_ch07
    also_in:
    - chemistry_ch08
  octet_rule:
    defines: The tendency of main-group atoms to form bonds until they are surrounded
      by eight valence electrons, achieving a noble gas configuration.
    composed_of:
    - valence_electrons
    - noble_gas_configuration
    - lewis_structure
    tier: 4
    source_domain: chemistry_ch07
  formal_charge:
    defines: A hypothetical charge assigned to each atom in a Lewis structure by assuming
      bonding electrons are split equally, used to identify the most reasonable structure.
    composed_of:
    - lewis_structure
    - valence_electrons
    tier: 4
    source_domain: chemistry_ch07
  lattice_energy:
    defines: The energy required to separate one mole of an ionic solid into its gaseous
      component ions, a measure of ionic bond strength that increases with higher
      ionic charges and smaller ionic radii.
    composed_of:
    - ionic_compound
    - electrostatic_force
    tier: 4
    source_domain: chemistry_ch07
  vsepr_theory:
    defines: A model predicting the three-dimensional geometry around a central atom
      by placing all electron pairs as far apart as possible to minimize electrostatic
      repulsion.
    composed_of:
    - lewis_structure
    - lone_pair
    - electrostatic_force
    tier: 4
    source_domain: chemistry_ch07
    also_in:
    - chemistry_ch08
  bond_dipole_moment:
    defines: The vector quantity representing the charge separation in a polar covalent
      bond, with magnitude proportional to the partial charge and bond length, directed
      from the less to the more electronegative atom.
    composed_of:
    - polar_covalent_bond
    - bond_length
    tier: 4
    source_domain: chemistry_ch07
  octet_rule_exceptions:
    defines: Cases where the central atom has fewer than eight electrons, more than
      eight, or an odd number in its valence shell.
    composed_of:
    - octet_rule
    - lewis_structure
    tier: 5
    source_domain: chemistry_ch07
  resonance:
    defines: A description of electron delocalization in which the true electronic
      structure of a molecule is represented as an average of two or more valid Lewis
      structures with the same atomic arrangement.
    composed_of:
    - lewis_structure
    - formal_charge
    tier: 5
    source_domain: chemistry_ch07
    also_in:
    - chemistry_ch08
  electron_pair_geometry:
    defines: The three-dimensional arrangement of all regions of electron density
      around a central atom, independent of whether those regions contain atoms.
    composed_of:
    - vsepr_theory
    - lewis_structure
    tier: 5
    source_domain: chemistry_ch07
  resonance_hybrid:
    defines: The actual, averaged electronic structure of a molecule that cannot be
      adequately represented by a single Lewis structure, intermediate among all resonance
      forms.
    composed_of:
    - resonance
    tier: 6
    source_domain: chemistry_ch07
  molecular_structure:
    defines: The three-dimensional arrangement of only the atoms in a molecule, which
      may differ from the electron-pair geometry when lone pairs are present on the
      central atom.
    composed_of:
    - electron_pair_geometry
    - lone_pair
    tier: 6
    source_domain: chemistry_ch07
  bond_angle:
    defines: The angle between any two bonds sharing a common atom, determined by
      the electron-pair geometry and modified by the relative repulsion strengths
      of lone pairs versus bonding pairs.
    composed_of:
    - electron_pair_geometry
    - lone_pair
    tier: 6
    source_domain: chemistry_ch07
  molecular_dipole_moment:
    defines: The net vector sum of all bond dipole moments in a molecule, which is
      nonzero only when the bond dipoles do not cancel due to molecular geometry.
    composed_of:
    - bond_dipole_moment
    - molecular_structure
    tier: 7
    source_domain: chemistry_ch07
  orbital_overlap:
    defines: The coexistence of orbitals from two different atoms sharing the same
      region of space, which is the prerequisite for covalent bond formation in valence
      bond theory.
    composed_of:
    - atomic_orbitals
    - covalent_bond
    tier: 1
    source_domain: chemistry_ch08
  lcao:
    defines: The mathematical technique of adding or subtracting atomic wave functions
      to generate molecular orbitals that extend over the whole molecule.
    composed_of:
    - wave_function
    - atomic_orbitals
    tier: 1
    source_domain: chemistry_ch08
  valence_bond_theory:
    defines: A model describing covalent bond formation as the overlap of half-filled
      atomic orbitals on adjacent atoms, yielding a shared electron pair stabilized
      by both nuclei.
    composed_of:
    - orbital_overlap
    - covalent_bond
    tier: 2
    source_domain: chemistry_ch08
  bond_distance:
    defines: The optimal internuclear separation at which the energy of a bonded system
      reaches its minimum, balancing attractive and repulsive forces.
    composed_of:
    - orbital_overlap
    tier: 2
    source_domain: chemistry_ch08
  sigma_bond:
    defines: A covalent bond in which electron density is concentrated along the internuclear
      axis, formed by end-to-end overlap of s or p orbitals.
    composed_of:
    - orbital_overlap
    - covalent_bond
    tier: 2
    source_domain: chemistry_ch08
  pi_bond:
    defines: A covalent bond formed by side-by-side overlap of two p orbitals, with
      electron density located on opposite sides of the internuclear axis and a nodal
      plane along the axis.
    composed_of:
    - orbital_overlap
    - covalent_bond
    tier: 2
    source_domain: chemistry_ch08
  molecular_orbital:
    defines: A region of space (described by a combined wave function) in which an
      electron in a molecule has a high probability of being found, delocalized over
      two or more atoms.
    composed_of:
    - lcao
    tier: 2
    source_domain: chemistry_ch08
  hybridization:
    defines: The mathematical mixing of valence atomic orbitals on a central atom
      to produce a new set of equivalent hybrid orbitals whose geometry matches the
      observed molecular structure.
    composed_of:
    - valence_bond_theory
    - wave_function
    tier: 3
    source_domain: chemistry_ch08
    also_in:
    - chemistry_ch20
  multiple_bonds:
    defines: Double or triple bonds between two atoms, each consisting of one sigma
      bond formed by hybridized orbitals plus one or two pi bonds formed by unhybridized
      p orbitals.
    composed_of:
    - sigma_bond
    - pi_bond
    tier: 3
    source_domain: chemistry_ch08
  bonding_molecular_orbital:
    defines: A molecular orbital formed by in-phase (constructive) combination of
      atomic wave functions, located primarily between the nuclei and lower in energy
      than the parent atomic orbitals.
    composed_of:
    - lcao
    - molecular_orbital
    tier: 3
    source_domain: chemistry_ch08
  antibonding_molecular_orbital:
    defines: A molecular orbital formed by out-of-phase (destructive) combination
      of atomic wave functions, containing a node between the nuclei and higher in
      energy than the parent atomic orbitals.
    composed_of:
    - lcao
    - molecular_orbital
    tier: 3
    source_domain: chemistry_ch08
  sp_hybridization:
    defines: The mixing of one s and one p orbital to produce two equivalent sp hybrid
      orbitals oriented 180 degrees apart in a linear geometry.
    composed_of:
    - hybridization
    tier: 4
    source_domain: chemistry_ch08
  sp2_hybridization:
    defines: The mixing of one s and two p orbitals to produce three equivalent sp2
      hybrid orbitals oriented 120 degrees apart in a trigonal planar geometry, leaving
      one unhybridized p orbital.
    composed_of:
    - hybridization
    tier: 4
    source_domain: chemistry_ch08
  sp3_hybridization:
    defines: The mixing of one s and all three p orbitals to produce four equivalent
      sp3 hybrid orbitals directed toward the corners of a tetrahedron at 109.5 degrees.
    composed_of:
    - hybridization
    tier: 4
    source_domain: chemistry_ch08
  sp3d_hybridization:
    defines: The mixing of one s, three p, and one d orbital to produce five equivalent
      hybrid orbitals arranged in a trigonal bipyramidal geometry.
    composed_of:
    - hybridization
    tier: 4
    source_domain: chemistry_ch08
  sp3d2_hybridization:
    defines: The mixing of one s, three p, and two d orbitals to produce six equivalent
      hybrid orbitals arranged in an octahedral geometry.
    composed_of:
    - hybridization
    tier: 4
    source_domain: chemistry_ch08
  restricted_rotation:
    defines: The inability of atoms connected by a double or triple bond to rotate
      freely about the internuclear axis, because rotation would break the side-by-side
      p-orbital overlap of the pi bond.
    composed_of:
    - pi_bond
    - multiple_bonds
    tier: 4
    source_domain: chemistry_ch08
  electron_delocalization:
    defines: The spreading of pi electrons over more than two atoms when resonance
      structures exist, so that these electrons are not confined to any single bond
      location.
    composed_of:
    - resonance
    - pi_bond
    tier: 4
    source_domain: chemistry_ch08
  molecular_orbital_theory:
    defines: A bonding model in which atomic wave functions are combined via LCAO
      to yield molecular orbitals delocalized over the entire molecule, filled according
      to the Aufbau principle and Hund's rule.
    composed_of:
    - bonding_molecular_orbital
    - antibonding_molecular_orbital
    - electron_configuration
    tier: 4
    source_domain: chemistry_ch08
  bond_order:
    defines: A measure of bond strength calculated as (number of bonding electrons
      minus number of antibonding electrons) divided by two; a bond order of zero
      means no stable bond forms.
    composed_of:
    - molecular_orbital_theory
    tier: 5
    source_domain: chemistry_ch08
  paramagnetism:
    defines: The property of a substance with one or more unpaired electrons to be
      attracted to an external magnetic field.
    composed_of:
    - molecular_orbital_theory
    tier: 5
    source_domain: chemistry_ch08
  diamagnetism:
    defines: The property of a substance with all electrons paired to be weakly repelled
      by an external magnetic field.
    composed_of:
    - molecular_orbital_theory
    tier: 5
    source_domain: chemistry_ch08
  sp_mixing:
    defines: The interaction of sigma-s and sigma-p molecular orbitals of similar
      energy that raises the sigma-p orbital above the pi-p orbitals in energy, observed
      in period-2 diatomics from Li through N.
    composed_of:
    - molecular_orbital_theory
    tier: 5
    source_domain: chemistry_ch08
  pressure:
    defines: The force exerted by gas molecules per unit area of surface, caused by
      molecular collisions; expressed as P = F/A.
    composed_of:
    - force
    - area
    tier: 1
    source_domain: chemistry_ch09
  mole_fraction:
    defines: The dimensionless ratio of the moles of one component to the total moles
      of all components in a mixture, used to calculate partial pressures.
    composed_of:
    - amount_of_substance
    tier: 1
    source_domain: chemistry_ch09
    also_in:
    - chemistry_ch11
  pressure_units:
    defines: A set of standard units for expressing pressure (pascal, atm, torr, bar,
      psi, mm Hg) with defined conversion factors among them.
    composed_of:
    - pressure
    tier: 2
    source_domain: chemistry_ch09
  atmospheric_pressure:
    defines: The pressure exerted by the weight of the overlying column of atmosphere,
      approximately 1 atm (101,325 Pa) at sea level.
    composed_of:
    - pressure
    tier: 2
    source_domain: chemistry_ch09
  hydrostatic_pressure:
    defines: The pressure exerted by a fluid column due to gravity, given by p = h*rho*g,
      where h is height, rho is density, and g is gravitational acceleration.
    composed_of:
    - pressure
    - density
    tier: 2
    source_domain: chemistry_ch09
  amontons_law:
    defines: At constant volume and fixed amount of gas, pressure is directly proportional
      to Kelvin temperature (P1/T1 = P2/T2).
    composed_of:
    - pressure
    - temperature_kelvin
    tier: 2
    source_domain: chemistry_ch09
  charles_law:
    defines: At constant pressure and fixed amount of gas, volume is directly proportional
      to Kelvin temperature (V1/T1 = V2/T2).
    composed_of:
    - volume
    - temperature_kelvin
    - pressure
    tier: 2
    source_domain: chemistry_ch09
  boyle_law:
    defines: At constant temperature and fixed amount of gas, pressure and volume
      are inversely proportional (P1*V1 = P2*V2).
    composed_of:
    - pressure
    - volume
    tier: 2
    source_domain: chemistry_ch09
  avogadros_law:
    defines: At constant temperature and pressure, the volume of a gas is directly
      proportional to the number of moles (V/n = constant).
    composed_of:
    - volume
    - amount_of_substance
    - pressure
    tier: 2
    source_domain: chemistry_ch09
  ideal_gas:
    defines: A hypothetical gas whose molecules occupy no volume and exert no forces
      on each other, accurately described by the gas laws at low pressures and high
      temperatures.
    composed_of:
    - pressure
    - volume
    - temperature_kelvin
    - amount_of_substance
    tier: 2
    source_domain: chemistry_ch09
  standard_conditions_stp:
    defines: A defined reference state of 273.15 K (0 C) and 1 atm (101.325 kPa) used
      to compare and report gas properties.
    composed_of:
    - temperature_kelvin
    - pressure
    tier: 2
    source_domain: chemistry_ch09
  diffusion:
    defines: The net movement of gas molecules from a region of higher concentration
      to a region of lower concentration driven by random molecular motion.
    composed_of:
    - pressure
    tier: 2
    source_domain: chemistry_ch09
  mean_free_path:
    defines: The average distance a gas molecule travels between successive collisions
      with other molecules; increases as pressure decreases.
    composed_of:
    - pressure
    tier: 2
    source_domain: chemistry_ch09
  effusion:
    defines: The escape of gas molecules through a tiny opening into a vacuum; distinct
      from diffusion in that molecules pass through a physical barrier.
    composed_of:
    - pressure
    tier: 2
    source_domain: chemistry_ch09
  ideal_gas_law:
    defines: The unified equation PV = nRT combining Boyle's, Charles's, Amontons's,
      and Avogadro's laws, relating pressure, volume, moles, and Kelvin temperature
      via the universal gas constant R.
    composed_of:
    - boyle_law
    - charles_law
    - amontons_law
    - avogadros_law
    - ideal_gas
    tier: 3
    source_domain: chemistry_ch09
  grahams_law:
    defines: The rate of effusion of a gas is inversely proportional to the square
      root of its molar mass; rate_A/rate_B = sqrt(M_B/M_A).
    composed_of:
    - effusion
    - molar_mass
    tier: 3
    source_domain: chemistry_ch09
  combined_gas_law:
    defines: A form of the ideal gas law for a fixed amount of gas allowing simultaneous
      changes in P, V, and T; P1*V1/T1 = P2*V2/T2.
    composed_of:
    - ideal_gas_law
    tier: 4
    source_domain: chemistry_ch09
  standard_molar_volume:
    defines: The volume occupied by exactly one mole of an ideal gas at STP, approximately
      22.4 L.
    composed_of:
    - ideal_gas_law
    - standard_conditions_stp
    tier: 4
    source_domain: chemistry_ch09
  gas_density:
    defines: The mass per unit volume of a gas sample, derived from the ideal gas
      law as d = P*M/(R*T), where M is molar mass.
    composed_of:
    - ideal_gas_law
    - molar_mass
    tier: 4
    source_domain: chemistry_ch09
  partial_pressure:
    defines: The pressure that a single component of a gas mixture would exert if
      it alone occupied the container at the same temperature and volume.
    composed_of:
    - pressure
    - ideal_gas_law
    tier: 4
    source_domain: chemistry_ch09
    also_in:
    - chemistry_ch11
    - chemistry_ch13
  compressibility_factor:
    defines: The ratio of the actual molar volume of a real gas to the molar volume
      predicted by the ideal gas law (Z = P*Vm/RT); deviations from Z = 1 indicate
      non-ideal behavior.
    composed_of:
    - ideal_gas_law
    tier: 4
    source_domain: chemistry_ch09
  non_ideal_gas_behavior:
    defines: Deviations of real gases from the ideal gas law, caused by finite molecular
      volume and intermolecular attractions, most pronounced at high pressures and
      low temperatures.
    composed_of:
    - ideal_gas_law
    - molecular_volume
    - intermolecular_forces
    tier: 4
    source_domain: chemistry_ch09
  kinetic_molecular_theory:
    defines: A microscopic model of ideal gas behavior based on five postulates -
      molecules in constant random motion, negligibly small, pressure through wall
      collisions, elastic collisions, average KE proportional to Kelvin temperature.
    composed_of:
    - ideal_gas_law
    tier: 4
    source_domain: chemistry_ch09
    also_in:
    - chemistry_ch10
  maxwell_boltzmann_distribution:
    defines: The statistical distribution of molecular speeds in a gas sample at a
      given temperature, showing the relative number of molecules at each speed.
    composed_of:
    - kinetic_molecular_theory
    - temperature_kelvin
    tier: 5
    source_domain: chemistry_ch09
  average_kinetic_energy:
    defines: The mean translational kinetic energy of molecules in a gas sample, equal
      to (3/2)*R*T per mole and directly proportional to Kelvin temperature.
    composed_of:
    - kinetic_molecular_theory
    - temperature_kelvin
    tier: 5
    source_domain: chemistry_ch09
  daltons_law:
    defines: The total pressure of a mixture of ideal gases equals the sum of the
      partial pressures of all component gases.
    composed_of:
    - partial_pressure
    - mole_fraction
    tier: 5
    source_domain: chemistry_ch09
  vapor_pressure_of_water:
    defines: The partial pressure exerted by water vapor in equilibrium with liquid
      water at a given temperature; must be subtracted when collecting gases over
      water.
    composed_of:
    - partial_pressure
    - temperature_kelvin
    tier: 5
    source_domain: chemistry_ch09
  van_der_waals_equation:
    defines: A modified ideal gas law, (P + a*(n/V)^2)*(V - n*b) = n*R*T, that corrects
      for real gas behavior using empirical constants a (attraction) and b (volume).
    composed_of:
    - ideal_gas_law
    - non_ideal_gas_behavior
    tier: 5
    source_domain: chemistry_ch09
  root_mean_square_speed:
    defines: A statistical measure of average molecular speed defined as the square
      root of the mean squared speed; u_rms = sqrt(3*R*T/M).
    composed_of:
    - average_kinetic_energy
    - molar_mass
    tier: 6
    source_domain: chemistry_ch09
  intermolecular_forces:
    defines: Electrostatic attractions between atoms, molecules, or ions that determine
      physical properties such as phase, boiling point, and viscosity.
    composed_of:
    - electrostatic_force
    tier: 1
    source_domain: chemistry_ch10
    also_in:
    - chemistry_ch09
    - chemistry_ch11
  polarizability:
    defines: The ease with which an external charge can distort a molecule's electron
      cloud, determining the magnitude of dispersion forces.
    composed_of:
    - electrostatic_force
    tier: 1
    source_domain: chemistry_ch10
  dynamic_equilibrium:
    defines: A state in which two reciprocal processes occur at equal rates so that
      macroscopic quantities remain constant.
    composed_of:
    - kinetic_molecular_theory
    tier: 1
    source_domain: chemistry_ch10
    also_in:
    - chemistry_ch13
  crystalline_solid:
    defines: A solid in which particles are arranged in a definite, repeating three-dimensional
      pattern, giving it a sharp melting point.
    composed_of:
    - kinetic_molecular_theory
    tier: 1
    source_domain: chemistry_ch10
  dispersion_force:
    defines: A weak IMF arising from temporary instantaneous dipoles in any atom or
      molecule, increasing in strength with molecular size and polarizability.
    composed_of:
    - intermolecular_forces
    - polarizability
    tier: 2
    source_domain: chemistry_ch10
  dipole_dipole_attraction:
    defines: An IMF between the partially positive end of one polar molecule and the
      partially negative end of another polar molecule.
    composed_of:
    - intermolecular_forces
    - polarity_and_dipole_moment
    tier: 2
    source_domain: chemistry_ch10
  cohesive_forces:
    defines: IMFs between identical molecules within a liquid that hold it together
      and drive surface minimization.
    composed_of:
    - intermolecular_forces
    tier: 2
    source_domain: chemistry_ch10
  adhesive_forces:
    defines: IMFs between molecules of a liquid and molecules of a different surface
      with which the liquid is in contact.
    composed_of:
    - intermolecular_forces
    tier: 2
    source_domain: chemistry_ch10
  viscosity:
    defines: A liquid's resistance to flow, determined by the strength of IMFs between
      its molecules and their size and shape.
    composed_of:
    - intermolecular_forces
    tier: 2
    source_domain: chemistry_ch10
  vapor_pressure:
    defines: The pressure exerted by a vapor in dynamic equilibrium with its liquid
      or solid phase at a given temperature, reflecting the ease of vaporization.
    composed_of:
    - dynamic_equilibrium
    - intermolecular_forces
    tier: 2
    source_domain: chemistry_ch10
    also_in:
    - chemistry_ch11
  enthalpy_of_vaporization:
    defines: The heat required to convert one mole of a substance from liquid to gas,
      representing the energy needed to fully overcome IMFs.
    composed_of:
    - intermolecular_forces
    tier: 2
    source_domain: chemistry_ch10
  melting_and_freezing:
    defines: Phase transitions between solid and liquid states occurring at the melting/freezing
      point, where IMFs are partially overcome or re-established.
    composed_of:
    - intermolecular_forces
    tier: 2
    source_domain: chemistry_ch10
  amorphous_solid:
    defines: A solid lacking long-range ordered particle arrangement, causing it to
      soften gradually over a range of temperatures rather than melting sharply.
    composed_of:
    - crystalline_solid
    tier: 2
    source_domain: chemistry_ch10
  ionic_solid:
    defines: A crystalline solid composed of positive and negative ions held together
      by strong electrostatic attractions, characterized by high melting points and
      electrical conductivity only when molten or dissolved.
    composed_of:
    - crystalline_solid
    - electrostatic_force
    tier: 2
    source_domain: chemistry_ch10
  metallic_solid:
    defines: A crystalline solid of metal atoms held together by metallic bonding
      (delocalized electrons), giving rise to electrical conductivity, malleability,
      and luster.
    composed_of:
    - crystalline_solid
    tier: 2
    source_domain: chemistry_ch10
  covalent_network_solid:
    defines: A crystalline solid in which atoms are linked throughout by a continuous
      network of covalent bonds, resulting in extreme hardness and very high melting
      points.
    composed_of:
    - crystalline_solid
    tier: 2
    source_domain: chemistry_ch10
  molecular_solid:
    defines: A crystalline solid composed of neutral molecules held together by IMFs,
      with properties that vary with the type and strength of those forces.
    composed_of:
    - crystalline_solid
    - intermolecular_forces
    tier: 2
    source_domain: chemistry_ch10
  crystal_defects:
    defines: Irregularities in a crystal's repeating pattern—including vacancies,
      interstitial atoms, and substitutional impurities—that alter physical properties
      such as electrical conductivity.
    composed_of:
    - crystalline_solid
    tier: 2
    source_domain: chemistry_ch10
  unit_cell:
    defines: The smallest repeating structural unit of a crystalline solid whose repetition
      in three dimensions generates the entire crystal lattice.
    composed_of:
    - crystalline_solid
    tier: 2
    source_domain: chemistry_ch10
  hydrogen_bonding:
    defines: An exceptionally strong dipole-dipole attraction occurring when a hydrogen
      atom bonded to F, O, or N is attracted to another F, O, or N atom.
    composed_of:
    - dipole_dipole_attraction
    - electronegativity
    tier: 3
    source_domain: chemistry_ch10
  surface_tension:
    defines: The energy required to increase the surface area of a liquid, resulting
      from unbalanced cohesive forces on surface molecules.
    composed_of:
    - cohesive_forces
    tier: 3
    source_domain: chemistry_ch10
  capillary_action:
    defines: The flow of a liquid within a porous material or narrow tube driven by
      the interplay of adhesive forces between liquid and surface and cohesive forces
      within the liquid.
    composed_of:
    - adhesive_forces
    - cohesive_forces
    tier: 3
    source_domain: chemistry_ch10
  boiling_point:
    defines: The temperature at which a liquid's equilibrium vapor pressure equals
      the external pressure; at 1 atm this is the normal boiling point.
    composed_of:
    - vapor_pressure
    tier: 3
    source_domain: chemistry_ch10
  clausius_clapeyron_equation:
    defines: A mathematical relationship between vapor pressure, temperature, and
      enthalpy of vaporization used to calculate vapor pressure or boiling point at
      different conditions.
    composed_of:
    - vapor_pressure
    - enthalpy_of_vaporization
    tier: 3
    source_domain: chemistry_ch10
  enthalpy_of_fusion:
    defines: The heat required to convert one mole of a substance from solid to liquid,
      always smaller than the enthalpy of vaporization because IMFs are only partially
      overcome.
    composed_of:
    - intermolecular_forces
    - melting_and_freezing
    tier: 3
    source_domain: chemistry_ch10
  sublimation_and_deposition:
    defines: Direct phase transitions between the solid and gaseous states, bypassing
      the liquid phase.
    composed_of:
    - melting_and_freezing
    - intermolecular_forces
    tier: 3
    source_domain: chemistry_ch10
  triple_point:
    defines: The unique temperature and pressure at which all three phases of a substance
      coexist in equilibrium.
    composed_of:
    - dynamic_equilibrium
    - vapor_pressure
    - melting_and_freezing
    tier: 3
    source_domain: chemistry_ch10
  critical_point:
    defines: The temperature and pressure above which the liquid and gas phases of
      a substance are indistinguishable and no phase boundary exists.
    composed_of:
    - vapor_pressure
    - intermolecular_forces
    tier: 3
    source_domain: chemistry_ch10
  coordination_number:
    defines: The number of nearest-neighbor particles surrounding a given particle
      in a crystal structure.
    composed_of:
    - unit_cell
    tier: 3
    source_domain: chemistry_ch10
    also_in:
    - chemistry_ch19
  x_ray_crystallography:
    defines: An experimental technique that uses diffraction of X-rays by crystal
      planes to determine atomic spacing and crystal structure.
    composed_of:
    - unit_cell
    tier: 3
    source_domain: chemistry_ch10
  heating_cooling_curves:
    defines: Graphs depicting temperature changes in a substance as heat is added
      or removed, with flat plateaus at phase transition temperatures where energy
      goes into overcoming IMFs rather than raising temperature.
    composed_of:
    - specific_heat
    - melting_and_freezing
    - boiling_point
    - enthalpy_of_fusion
    - enthalpy_of_vaporization
    tier: 4
    source_domain: chemistry_ch10
  phase_diagram:
    defines: A pressure-temperature graph summarizing the conditions under which the
      solid, liquid, and gaseous phases of a substance are stable and the boundaries
      between phases.
    composed_of:
    - vapor_pressure
    - boiling_point
    - melting_and_freezing
    - triple_point
    - critical_point
    tier: 4
    source_domain: chemistry_ch10
  supercritical_fluid:
    defines: A state of matter above the critical temperature and pressure that exhibits
      properties intermediate between those of a liquid and a gas.
    composed_of:
    - critical_point
    tier: 4
    source_domain: chemistry_ch10
  enthalpy_of_sublimation:
    defines: The energy required to convert one mole of a solid directly to a gas,
      approximately equal to the sum of the enthalpies of fusion and vaporization.
    composed_of:
    - enthalpy_of_fusion
    - enthalpy_of_vaporization
    - sublimation_and_deposition
    tier: 4
    source_domain: chemistry_ch10
  simple_cubic_structure:
    defines: A crystal lattice in which atoms are arranged at the corners of a cube
      with a coordination number of six and a packing efficiency of about 52%.
    composed_of:
    - unit_cell
    - coordination_number
    tier: 4
    source_domain: chemistry_ch10
  body_centered_cubic:
    defines: A crystal lattice with atoms at all corners and one atom in the center
      of the cube, giving a coordination number of eight and packing efficiency of
      about 68%.
    composed_of:
    - unit_cell
    - coordination_number
    tier: 4
    source_domain: chemistry_ch10
  face_centered_cubic:
    defines: A crystal lattice with atoms at all corners and at the center of each
      face, giving a coordination number of twelve and the highest packing efficiency
      among cubic structures (~74%).
    composed_of:
    - unit_cell
    - coordination_number
    tier: 4
    source_domain: chemistry_ch10
  hexagonal_closest_packing:
    defines: A closest-packed crystal structure with alternating ABABAB layers of
      hexagonally arranged atoms, giving a coordination number of twelve.
    composed_of:
    - unit_cell
    - coordination_number
    tier: 4
    source_domain: chemistry_ch10
  bragg_equation:
    defines: The relation nλ = 2d sin θ that connects X-ray wavelength, interplanar
      spacing, and diffraction angle, enabling calculation of atomic distances from
      diffraction data.
    composed_of:
    - x_ray_crystallography
    tier: 4
    source_domain: chemistry_ch10
  ionic_crystal_structure:
    defines: The arrangement of ionic crystals in which larger anions form a closest-packed
      array and smaller cations occupy tetrahedral or octahedral holes, with cation-to-anion
      ratios governed by hole geometry.
    composed_of:
    - ionic_solid
    - face_centered_cubic
    tier: 5
    source_domain: chemistry_ch10
  solution:
    defines: A homogeneous mixture in which solute particles are dispersed at the
      molecular scale throughout a solvent and do not settle out over time.
    composed_of:
    - intermolecular_forces
    tier: 1
    source_domain: chemistry_ch11
    also_in:
    - chemistry_ch03
  ion_dipole_attraction:
    defines: The electrostatic attraction between an ion and the oppositely charged
      end of a polar molecule, the primary force driving dissolution of ionic compounds
      in water.
    composed_of:
    - ions
    - polarity
    tier: 1
    source_domain: chemistry_ch11
  amphiphilic_molecule:
    defines: A molecule possessing both a nonpolar (hydrophobic) end and a polar (hydrophilic)
      end, enabling it to bridge polar and nonpolar phases.
    composed_of:
    - polarity
    - intermolecular_forces
    tier: 1
    source_domain: chemistry_ch11
  solvent_and_solute:
    defines: The solvent is the component present in greatest concentration that determines
      the physical state of the solution; solutes are the other components dissolved
      within it.
    composed_of:
    - solution
    tier: 2
    source_domain: chemistry_ch11
  molality:
    defines: A temperature-independent concentration unit defined as the number of
      moles of solute per kilogram of solvent.
    composed_of:
    - solution
    tier: 2
    source_domain: chemistry_ch11
  like_dissolves_like:
    defines: The empirical rule that polar solutes dissolve in polar solvents and
      nonpolar solutes dissolve in nonpolar solvents, based on matching intermolecular
      force strengths.
    composed_of:
    - intermolecular_forces
    - polarity
    - solution
    tier: 2
    source_domain: chemistry_ch11
  colloid:
    defines: A mixture in which particles larger than typical dissolved molecules
      but small enough not to settle (roughly 1-1000 nm) are dispersed uniformly throughout
      a continuous medium.
    composed_of:
    - solution
    tier: 2
    source_domain: chemistry_ch11
  solvation:
    defines: The exothermic process by which solvent molecules establish intermolecular
      attractive forces with solute particles, stabilizing them in solution.
    composed_of:
    - intermolecular_forces
    - solvent_and_solute
    tier: 3
    source_domain: chemistry_ch11
  colligative_property:
    defines: A solution property (vapor pressure lowering, boiling point elevation,
      freezing point depression, osmotic pressure) that depends only on the total
      concentration of solute particles, not their chemical identity.
    composed_of:
    - solution
    - molality
    tier: 3
    source_domain: chemistry_ch11
  tyndall_effect:
    defines: The scattering of visible light by colloidal-sized particles, making
      colloidal dispersions appear cloudy or opaque and distinguishing them from true
      solutions.
    composed_of:
    - colloid
    tier: 3
    source_domain: chemistry_ch11
  dissolution_process:
    defines: The spontaneous formation of a solution driven by a balance of endothermic
      solute-solute and solvent-solvent bond breaking and exothermic solvation, with
      matter dispersal always increasing.
    composed_of:
    - solvation
    - solution
    tier: 4
    source_domain: chemistry_ch11
  ideal_solution:
    defines: A solution that forms with no net change in energy because solute-solvent
      interactions are identical in strength to the pure-component interactions.
    composed_of:
    - solution
    - solvation
    tier: 4
    source_domain: chemistry_ch11
  dissociation:
    defines: The physical process by which an ionic compound separates into its constituent
      solvated ions upon dissolving in water.
    composed_of:
    - solvation
    - ion_dipole_attraction
    tier: 4
    source_domain: chemistry_ch11
  osmosis:
    defines: The net diffusion of solvent molecules through a semipermeable membrane
      from a region of lower solute concentration to a region of higher solute concentration.
    composed_of:
    - solution
    - colligative_property
    tier: 4
    source_domain: chemistry_ch11
  electrolyte:
    defines: A substance that produces freely mobile ions when dissolved in water,
      enabling the solution to conduct electricity.
    composed_of:
    - dissociation
    - solution
    tier: 5
    source_domain: chemistry_ch11
  solubility:
    defines: The maximum concentration of a solute that can be dissolved in a given
      solvent at a specified temperature and pressure when the dissolution process
      is at equilibrium.
    composed_of:
    - dissolution_process
    tier: 5
    source_domain: chemistry_ch11
    also_in:
    - chemistry_ch04
  raoults_law:
    defines: The relationship stating that the partial vapor pressure of each volatile
      component of an ideal solution equals its pure-component vapor pressure multiplied
      by its mole fraction.
    composed_of:
    - vapor_pressure
    - mole_fraction
    - ideal_solution
    tier: 5
    source_domain: chemistry_ch11
  osmotic_pressure:
    defines: The pressure that must be applied to a solution to halt the net transfer
      of solvent through a semipermeable membrane, given by Pi = MRT for dilute solutions.
    composed_of:
    - osmosis
    - colligative_property
    - molarity
    tier: 5
    source_domain: chemistry_ch11
  strong_electrolyte:
    defines: A substance that dissociates or ionizes essentially completely when dissolved,
      yielding maximum ion concentration.
    composed_of:
    - electrolyte
    tier: 6
    source_domain: chemistry_ch11
  weak_electrolyte:
    defines: A substance that only partially ionizes in water, producing a relatively
      low concentration of ions in solution.
    composed_of:
    - electrolyte
    tier: 6
    source_domain: chemistry_ch11
  nonelectrolyte:
    defines: A substance that dissolves in water without producing ions and therefore
      does not conduct electricity.
    composed_of:
    - electrolyte
    tier: 6
    source_domain: chemistry_ch11
  saturated_solution:
    defines: A solution in which the solute concentration equals its solubility, representing
      the equilibrium state between dissolved and undissolved solute.
    composed_of:
    - solubility
    tier: 6
    source_domain: chemistry_ch11
  henrys_law:
    defines: The proportional relationship between the concentration of a dissolved
      gas and the partial pressure of that gas above the solution, expressed as Cg
      = kPg.
    composed_of:
    - solubility
    - partial_pressure
    tier: 6
    source_domain: chemistry_ch11
  temperature_effect_on_solubility:
    defines: The dependence of solubility on temperature — gas solubility typically
      decreases with increasing temperature, while most solid solubilities increase
      with temperature.
    composed_of:
    - solubility
    tier: 6
    source_domain: chemistry_ch11
  miscibility:
    defines: The degree to which two liquids dissolve in each other; miscible liquids
      mix in all proportions, immiscible liquids have negligible mutual solubility,
      and partially miscible liquids fall between.
    composed_of:
    - solubility
    - like_dissolves_like
    tier: 6
    source_domain: chemistry_ch11
  vapor_pressure_lowering:
    defines: The reduction in a solvent's vapor pressure caused by the presence of
      a nonvolatile solute, quantified by Raoult's law as proportional to the solute
      mole fraction.
    composed_of:
    - raoults_law
    - colligative_property
    tier: 6
    source_domain: chemistry_ch11
  vant_hoff_factor:
    defines: The experimentally measured ratio of moles of particles in solution to
      moles of formula units dissolved, used to correct colligative property calculations
      for electrolytes that do not fully dissociate.
    composed_of:
    - electrolyte
    - colligative_property
    tier: 6
    source_domain: chemistry_ch11
  supersaturated_solution:
    defines: A nonequilibrium solution in which the dissolved solute concentration
      exceeds its solubility, typically prepared by cooling a hot saturated solution.
    composed_of:
    - saturated_solution
    tier: 7
    source_domain: chemistry_ch11
  boiling_point_elevation:
    defines: The increase in a solution's boiling point relative to the pure solvent,
      directly proportional to solute molality via the ebullioscopic constant Kb.
    composed_of:
    - vapor_pressure_lowering
    - molality
    tier: 7
    source_domain: chemistry_ch11
  freezing_point_depression:
    defines: The decrease in a solution's freezing point relative to the pure solvent,
      directly proportional to solute molality via the cryoscopic constant Kf.
    composed_of:
    - vapor_pressure_lowering
    - molality
    tier: 7
    source_domain: chemistry_ch11
  emulsion:
    defines: A colloidal dispersion of one immiscible liquid as droplets throughout
      another liquid, typically stabilized by an amphiphilic emulsifying agent.
    composed_of:
    - colloid
    - miscibility
    tier: 7
    source_domain: chemistry_ch11
  reaction_rate:
    defines: The change in concentration of a reactant or product per unit time, expressed
      as a positive quantity by convention.
    composed_of:
    - molar_concentration
    tier: 1
    source_domain: chemistry_ch12
    also_in:
    - chemistry_ch13
  average_rate:
    defines: The reaction rate computed as the ratio of a measured change in concentration
      to the time interval over which it occurred.
    composed_of:
    - reaction_rate
    tier: 2
    source_domain: chemistry_ch12
  instantaneous_rate:
    defines: The reaction rate at a specific moment in time, equal to the negative
      slope of the tangent line to a concentration-versus-time curve.
    composed_of:
    - reaction_rate
    tier: 2
    source_domain: chemistry_ch12
  stoichiometric_rate_relations:
    defines: The mathematical relationships between the rates of consumption of reactants
      and formation of products, derived directly from stoichiometric coefficients.
    composed_of:
    - reaction_rate
    - stoichiometry
    tier: 2
    source_domain: chemistry_ch12
  factors_affecting_rates:
    defines: 'Five parameters that influence reaction rate: chemical nature of reactants,
      physical state and surface area, temperature, reactant concentration, and presence
      of a catalyst.'
    composed_of:
    - reaction_rate
    tier: 2
    source_domain: chemistry_ch12
  collision_theory:
    defines: A kinetic model stating that reactions occur only when reactant molecules
      collide with both sufficient energy and proper orientation.
    composed_of:
    - reaction_rate
    - temperature
    tier: 2
    source_domain: chemistry_ch12
  rate_law:
    defines: A mathematical expression relating the rate of a chemical reaction to
      the rate constant and the concentrations of reactants raised to experimentally
      determined exponents.
    composed_of:
    - reaction_rate
    - molar_concentration
    tier: 2
    source_domain: chemistry_ch12
  initial_rate:
    defines: The instantaneous rate of a reaction at time zero, immediately after
      the reaction commences.
    composed_of:
    - instantaneous_rate
    tier: 3
    source_domain: chemistry_ch12
  rate_constant:
    defines: The proportionality constant k in a rate law, specific to a given reaction
      at a given temperature and independent of reactant concentrations.
    composed_of:
    - rate_law
    tier: 3
    source_domain: chemistry_ch12
  reaction_order:
    defines: The exponent on a reactant's concentration term in the rate law, indicating
      how strongly that reactant's concentration affects the reaction rate.
    composed_of:
    - rate_law
    tier: 3
    source_domain: chemistry_ch12
  integrated_rate_law:
    defines: A mathematical equation, derived by integrating the differential rate
      law, that relates reactant concentration directly to elapsed reaction time.
    composed_of:
    - rate_law
    tier: 3
    source_domain: chemistry_ch12
  activation_energy:
    defines: The minimum energy that colliding reactant molecules must possess for
      a reaction to occur and products to form.
    composed_of:
    - collision_theory
    tier: 3
    source_domain: chemistry_ch12
    also_in:
    - chemistry_ch13
  elementary_reaction:
    defines: A single-step reaction that occurs exactly as depicted in its equation,
      for which the rate law can be written directly from the stoichiometry.
    composed_of:
    - rate_law
    - stoichiometry
    tier: 3
    source_domain: chemistry_ch12
  overall_reaction_order:
    defines: The sum of the individual reaction orders for all reactants appearing
      in the rate law.
    composed_of:
    - reaction_order
    tier: 4
    source_domain: chemistry_ch12
  method_of_initial_rates:
    defines: An experimental technique for determining rate laws by measuring initial
      reaction rates across trials with systematically varied reactant concentrations.
    composed_of:
    - initial_rate
    - rate_law
    tier: 4
    source_domain: chemistry_ch12
  first_order_kinetics:
    defines: Reaction behavior in which the rate is directly proportional to the concentration
      of one reactant, yielding a linear plot of ln[A] versus time.
    composed_of:
    - integrated_rate_law
    tier: 4
    source_domain: chemistry_ch12
    also_in:
    - chemistry_ch21
  second_order_kinetics:
    defines: Reaction behavior in which the rate depends on the square of a reactant's
      concentration, yielding a linear plot of 1/[A] versus time.
    composed_of:
    - integrated_rate_law
    tier: 4
    source_domain: chemistry_ch12
  zero_order_kinetics:
    defines: Reaction behavior in which the rate is constant and independent of reactant
      concentration, yielding a linear plot of [A] versus time.
    composed_of:
    - integrated_rate_law
    tier: 4
    source_domain: chemistry_ch12
  activated_complex:
    defines: The unstable, short-lived species formed when reactants collide with
      sufficient energy and proper orientation, representing the energy maximum along
      the reaction pathway.
    composed_of:
    - collision_theory
    - activation_energy
    tier: 4
    source_domain: chemistry_ch12
  arrhenius_equation:
    defines: The mathematical relationship k = Ae^(−Ea/RT) that quantifies how the
      rate constant depends on activation energy, temperature, and a frequency factor.
    composed_of:
    - rate_constant
    - activation_energy
    - temperature
    tier: 4
    source_domain: chemistry_ch12
  reaction_mechanism:
    defines: The stepwise sequence of elementary reactions that describes the precise
      molecular pathway by which reactants are converted into products.
    composed_of:
    - elementary_reaction
    - stoichiometry
    tier: 4
    source_domain: chemistry_ch12
  molecularity:
    defines: The number of reactant entities involved in an elementary reaction step,
      classified as unimolecular, bimolecular, or termolecular.
    composed_of:
    - elementary_reaction
    tier: 4
    source_domain: chemistry_ch12
  catalyst:
    defines: A substance that increases the rate of a chemical reaction by providing
      an alternative mechanism with a lower activation energy, without itself being
      consumed.
    composed_of:
    - reaction_rate
    - activation_energy
    tier: 4
    source_domain: chemistry_ch12
  half_life:
    defines: The time required for the concentration of a reactant to decrease by
      one-half; for first-order reactions it is constant, while for zero- and second-order
      reactions it depends on concentration.
    composed_of:
    - first_order_kinetics
    - second_order_kinetics
    - zero_order_kinetics
    tier: 5
    source_domain: chemistry_ch12
    also_in:
    - chemistry_ch21
  frequency_factor:
    defines: The pre-exponential constant A in the Arrhenius equation, reflecting
      the frequency of collisions with the correct orientation to produce a reaction.
    composed_of:
    - arrhenius_equation
    tier: 5
    source_domain: chemistry_ch12
  reaction_intermediate:
    defines: A species produced in one elementary step of a mechanism and consumed
      in a subsequent step, not appearing in the overall balanced equation.
    composed_of:
    - reaction_mechanism
    - elementary_reaction
    tier: 5
    source_domain: chemistry_ch12
  rate_determining_step:
    defines: The slowest elementary reaction in a mechanism, which controls the rate
      of the overall reaction.
    composed_of:
    - reaction_mechanism
    - elementary_reaction
    tier: 5
    source_domain: chemistry_ch12
  homogeneous_catalyst:
    defines: A catalyst that is present in the same phase as the reactants, forming
      a transient intermediate before regenerating and yielding product.
    composed_of:
    - catalyst
    tier: 5
    source_domain: chemistry_ch12
  heterogeneous_catalyst:
    defines: A catalyst present in a different phase than the reactants, functioning
      by adsorbing reactants onto its surface to activate and facilitate the reaction.
    composed_of:
    - catalyst
    tier: 5
    source_domain: chemistry_ch12
  reaction_quotient:
    defines: A ratio of product to reactant concentrations or partial pressures at
      any point during a reaction, used to assess distance from equilibrium.
    composed_of:
    - concentration
    - partial_pressure
    - stoichiometry
    tier: 1
    source_domain: chemistry_ch13
    also_in:
    - chemistry_ch15
    - chemistry_ch16
    - chemistry_ch17
  law_of_mass_action:
    defines: The principle that the reaction quotient for a system at equilibrium
      is constant at a given temperature, defining the equilibrium constant K.
    composed_of:
    - reaction_quotient
    - dynamic_equilibrium
    tier: 2
    source_domain: chemistry_ch13
  equilibrium_constant:
    defines: The fixed numerical value of the reaction quotient when the system has
      reached equilibrium at a given temperature.
    composed_of:
    - law_of_mass_action
    tier: 3
    source_domain: chemistry_ch13
    also_in:
    - chemistry_ch17
  q_vs_k_comparison:
    defines: Comparing Q to K predicts whether a mixture will shift forward (Q < K),
      reverse (Q > K), or is at equilibrium (Q = K).
    composed_of:
    - reaction_quotient
    - equilibrium_constant
    tier: 4
    source_domain: chemistry_ch13
  kc_kp_relationship:
    defines: The quantitative conversion KP = Kc(RT)^Δn between concentration-based
      and pressure-based equilibrium constants.
    composed_of:
    - equilibrium_constant
    - temperature
    tier: 4
    source_domain: chemistry_ch13
  homogeneous_equilibrium:
    defines: An equilibrium in which all species are in the same phase, so all appear
      as concentration or pressure terms in K.
    composed_of:
    - equilibrium_constant
    tier: 4
    source_domain: chemistry_ch13
  heterogeneous_equilibrium:
    defines: An equilibrium involving multiple phases, where pure solids and liquids
      are omitted from Q and K expressions.
    composed_of:
    - equilibrium_constant
    - homogeneous_equilibrium
    tier: 5
    source_domain: chemistry_ch13
  coupled_equilibria:
    defines: Two or more equilibrium reactions sharing species, whose combined K equals
      the product of individual K values after algebraic manipulation.
    composed_of:
    - equilibrium_constant
    tier: 4
    source_domain: chemistry_ch13
    also_in:
    - chemistry_ch15
  ice_table_method:
    defines: A systematic algebraic approach using Initial, Change, and Equilibrium
      rows to calculate unknown equilibrium concentrations or K.
    composed_of:
    - equilibrium_constant
    - stoichiometry
    - concentration
    tier: 4
    source_domain: chemistry_ch13
    also_in:
    - chemistry_ch14
  le_chatelier_principle:
    defines: When a stress unequally affects forward and reverse rates, the system
      shifts to partially counteract the stress and re-establish equilibrium.
    composed_of:
    - dynamic_equilibrium
    - equilibrium_constant
    tier: 4
    source_domain: chemistry_ch13
  concentration_stress:
    defines: Adding/removing a reactant or product shifts Q away from K, driving the
      reaction toward products or reactants until Q = K again.
    composed_of:
    - le_chatelier_principle
    - q_vs_k_comparison
    tier: 5
    source_domain: chemistry_ch13
  pressure_volume_stress:
    defines: Volume changes shift a gas-phase equilibrium toward the side with fewer
      moles of gas when Δn ≠ 0.
    composed_of:
    - le_chatelier_principle
    - stoichiometry
    tier: 5
    source_domain: chemistry_ch13
  temperature_stress:
    defines: Temperature changes shift endothermic equilibria toward products and
      exothermic equilibria toward reactants, and alter the numerical value of K.
    composed_of:
    - le_chatelier_principle
    - enthalpy_change
    tier: 5
    source_domain: chemistry_ch13
  catalyst_effect_on_equilibrium:
    defines: A catalyst lowers activation energy equally for both directions, accelerating
      approach to equilibrium without changing K or the equilibrium composition.
    composed_of:
    - le_chatelier_principle
    - activation_energy
    tier: 5
    source_domain: chemistry_ch13
  bronsted_lowry_acid:
    defines: A substance that donates a proton (H+) to another species in a chemical
      reaction.
    composed_of:
    - proton_transfer
    tier: 1
    source_domain: chemistry_ch14
  bronsted_lowry_base:
    defines: A substance that accepts a proton (H+) from another species in a chemical
      reaction.
    composed_of:
    - proton_transfer
    tier: 1
    source_domain: chemistry_ch14
  water_autoionization:
    defines: Reaction in which two water molecules transfer a proton between each
      other to produce H3O+ and OH−.
    composed_of:
    - proton_transfer
    - hydronium_ion
    - hydroxide_ion
    tier: 1
    source_domain: chemistry_ch14
  ph_scale:
    defines: Logarithmic scale pH = −log[H3O+] that compresses the wide range of hydronium
      ion concentrations into a convenient numerical range.
    composed_of:
    - hydronium_ion
    tier: 1
    source_domain: chemistry_ch14
  conjugate_acid_base_pair:
    defines: Two species related by the gain or loss of exactly one proton; the acid's
      conjugate base and the base's conjugate acid.
    composed_of:
    - bronsted_lowry_acid
    - bronsted_lowry_base
    tier: 2
    source_domain: chemistry_ch14
  amphiprotic_species:
    defines: A substance capable of both donating and accepting protons, acting as
      either a Brønsted-Lowry acid or base depending on the reaction partner.
    composed_of:
    - bronsted_lowry_acid
    - bronsted_lowry_base
    tier: 2
    source_domain: chemistry_ch14
  ion_product_constant_kw:
    defines: Equilibrium constant for water autoionization, [H3O+][OH−] = 1.0 × 10−14
      at 25 °C, establishing an inverse relationship between hydronium and hydroxide
      concentrations.
    composed_of:
    - water_autoionization
    - chemical_equilibrium
    tier: 2
    source_domain: chemistry_ch14
  acid_ionization:
    defines: Reaction in which an acid transfers a proton to water, yielding hydronium
      ions and the conjugate base of the acid.
    composed_of:
    - bronsted_lowry_acid
    - conjugate_acid_base_pair
    tier: 3
    source_domain: chemistry_ch14
  base_ionization:
    defines: Reaction in which a base accepts a proton from water, yielding hydroxide
      ions and the conjugate acid of the base.
    composed_of:
    - bronsted_lowry_base
    - conjugate_acid_base_pair
    tier: 3
    source_domain: chemistry_ch14
  poh_scale:
    defines: Logarithmic scale pOH = −log[OH−]; at 25 °C related to pH by pH + pOH
      = 14.
    composed_of:
    - hydroxide_ion
    - ion_product_constant_kw
    tier: 3
    source_domain: chemistry_ch14
  acidic_basic_neutral_classification:
    defines: 'Classification of aqueous solutions by comparing [H3O+] and [OH−]: acidic
      (pH < 7), basic (pH > 7), or neutral (pH = 7) at 25 °C.'
    composed_of:
    - ion_product_constant_kw
    - ph_scale
    tier: 3
    source_domain: chemistry_ch14
  acid_ionization_constant_ka:
    defines: Equilibrium constant for weak acid ionization in water; larger Ka indicates
      stronger acid with greater ionization at equilibrium.
    composed_of:
    - acid_ionization
    - chemical_equilibrium
    tier: 4
    source_domain: chemistry_ch14
  base_ionization_constant_kb:
    defines: Equilibrium constant for weak base ionization in water; larger Kb indicates
      stronger base producing higher hydroxide concentrations at equilibrium.
    composed_of:
    - base_ionization
    - chemical_equilibrium
    tier: 4
    source_domain: chemistry_ch14
  strong_weak_acid_base:
    defines: Classification by degree of ionization; strong acids/bases ionize completely
      while weak acids/bases ionize partially with measurable ionization constants.
    composed_of:
    - acid_ionization_constant_ka
    - base_ionization_constant_kb
    tier: 5
    source_domain: chemistry_ch14
  percent_ionization:
    defines: Percentage of an acid or base that ionizes in solution; equilibrium concentration
      of ionized form divided by initial concentration times 100; varies with initial
      concentration for weak species.
    composed_of:
    - acid_ionization_constant_ka
    - base_ionization_constant_kb
    tier: 5
    source_domain: chemistry_ch14
  conjugate_pair_strength_relation:
    defines: Inverse relationship between strengths of a conjugate pair expressed
      as Ka × Kb = Kw; stronger acid yields weaker conjugate base, and vice versa.
    composed_of:
    - conjugate_acid_base_pair
    - acid_ionization_constant_ka
    - base_ionization_constant_kb
    - ion_product_constant_kw
    tier: 5
    source_domain: chemistry_ch14
  structure_acidity_relationship:
    defines: Trends in acid strength based on molecular structure, including binary
      acid strength down a group or across a period, and oxyacid strength with central-atom
      oxidation state or electronegativity.
    composed_of:
    - bronsted_lowry_acid
    - acid_ionization_constant_ka
    tier: 5
    source_domain: chemistry_ch14
  hydrated_metal_ion_acidity:
    defines: Weak-acid behavior of dissolved metal ions that coordinate water molecules,
      polarizing the O-H bond and enabling proton donation to surrounding water.
    composed_of:
    - acid_ionization
    - acid_ionization_constant_ka
    tier: 5
    source_domain: chemistry_ch14
  polyprotic_acid:
    defines: An acid containing more than one ionizable proton per molecule; each
      successive ionization has a smaller ionization constant.
    composed_of:
    - acid_ionization
    - acid_ionization_constant_ka
    tier: 5
    source_domain: chemistry_ch14
  buffer_solution:
    defines: Solution containing a weak conjugate acid-base pair that resists pH changes
      by converting added strong acid or base into the weak conjugate partner.
    composed_of:
    - conjugate_acid_base_pair
    - acid_ionization_constant_ka
    - le_chateliers_principle
    tier: 5
    source_domain: chemistry_ch14
  henderson_hasselbalch_equation:
    defines: Logarithmic form of Ka expression, pH = pKa + log([A−]/[HA]), used to
      calculate buffer pH from the ratio of conjugate base to weak acid concentrations.
    composed_of:
    - acid_ionization_constant_ka
    - ph_scale
    - conjugate_acid_base_pair
    tier: 5
    source_domain: chemistry_ch14
  acid_base_indicator:
    defines: A weak acid or base whose protonated and deprotonated forms have distinct
      colors, changing color over a pH interval of approximately pKa ± 1 to signal
      the endpoint of a titration.
    composed_of:
    - conjugate_acid_base_pair
    - ph_scale
    - acid_ionization_constant_ka
    tier: 5
    source_domain: chemistry_ch14
  leveling_effect:
    defines: Water limits effective dissolved acid/base strength to H3O+ and OH− respectively;
      any stronger acid or base reacts completely with water and is leveled to those
      species.
    composed_of:
    - strong_weak_acid_base
    tier: 6
    source_domain: chemistry_ch14
  salt_hydrolysis:
    defines: Acid or base ionization of salt ions in water, making the solution acidic,
      basic, or neutral depending on whether constituent ions are conjugates of weak
      or strong acids and bases.
    composed_of:
    - conjugate_acid_base_pair
    - strong_weak_acid_base
    tier: 6
    source_domain: chemistry_ch14
  stepwise_ionization:
    defines: Sequential, one-proton-at-a-time ionization of a polyprotic acid or base;
      successive ionization constants decrease by large factors, allowing each step
      to be treated as an independent equilibrium.
    composed_of:
    - polyprotic_acid
    - acid_ionization_constant_ka
    tier: 6
    source_domain: chemistry_ch14
  buffer_capacity:
    defines: Quantity of strong acid or base a buffer can absorb before its pH changes
      by approximately one unit; determined by absolute concentrations of the conjugate
      pair, not just their ratio.
    composed_of:
    - buffer_solution
    tier: 6
    source_domain: chemistry_ch14
  titration_curve:
    defines: Plot of solution pH versus volume of added titrant revealing the four
      stages of a titration and guiding selection of an appropriate indicator.
    composed_of:
    - ph_scale
    - equivalence_point
    - acid_base_indicator
    tier: 6
    source_domain: chemistry_ch14
  solubility_equilibrium:
    defines: A dynamic equilibrium established when the rate of dissolution of a sparingly
      soluble ionic solid equals the rate of precipitation of its ions from solution.
    composed_of:
    - chemical_equilibrium
    - ionic_dissolution
    tier: 1
    source_domain: chemistry_ch15
  lewis_acid:
    defines: Any species that can accept an electron pair from a donor to form a coordinate
      covalent bond.
    composed_of:
    - coordinate_covalent_bond
    tier: 1
    source_domain: chemistry_ch15
  lewis_base:
    defines: Any species that can donate an electron pair to an acceptor to form a
      coordinate covalent bond.
    composed_of:
    - coordinate_covalent_bond
    tier: 1
    source_domain: chemistry_ch15
  solubility_product_constant:
    defines: The equilibrium constant for the dissolution of a sparingly soluble ionic
      compound, equal to the product of the equilibrium concentrations of its ions
      each raised to the power of their stoichiometric coefficients.
    composed_of:
    - solubility_equilibrium
    - ion_concentration
    tier: 2
    source_domain: chemistry_ch15
  common_ion_effect:
    defines: The decrease in solubility of an ionic compound caused by the presence
      in solution of an ion that the compound shares, which shifts the dissolution
      equilibrium toward the solid.
    composed_of:
    - solubility_equilibrium
    - le_chateliers_principle
    tier: 2
    source_domain: chemistry_ch15
  lewis_acid_base_adduct:
    defines: The compound or ion formed when a Lewis acid and a Lewis base combine
      through a coordinate covalent bond.
    composed_of:
    - lewis_acid
    - lewis_base
    tier: 2
    source_domain: chemistry_ch15
  ligand:
    defines: A molecule or ion that acts as a Lewis base and bonds to the central
      metal atom of a complex ion by donating an electron pair.
    composed_of:
    - lewis_base
    tier: 2
    source_domain: chemistry_ch15
    also_in:
    - chemistry_ch19
  molar_solubility:
    defines: The number of moles of a sparingly soluble compound that dissolve per
      liter of saturated solution, calculated from the Ksp using an ICE table.
    composed_of:
    - solubility_product_constant
    tier: 3
    source_domain: chemistry_ch15
  precipitation_prediction:
    defines: The comparison of the ion product reaction quotient Qsp to Ksp to determine
      whether a precipitate will form; precipitation occurs when Qsp exceeds Ksp.
    composed_of:
    - reaction_quotient
    - solubility_product_constant
    tier: 3
    source_domain: chemistry_ch15
  complex_ion:
    defines: An ion consisting of a central metal atom or ion bonded to surrounding
      molecules or ions (ligands) via coordinate covalent bonds; a specific type of
      Lewis acid-base adduct.
    composed_of:
    - lewis_acid_base_adduct
    - ligand
    tier: 3
    source_domain: chemistry_ch15
  formation_constant:
    defines: The equilibrium constant for the reaction in which a metal ion combines
      with ligands to form a complex ion; a large Kf indicates a very stable complex.
    composed_of:
    - chemical_equilibrium
    - complex_ion
    tier: 4
    source_domain: chemistry_ch15
  dissociation_constant:
    defines: The equilibrium constant for the decomposition of a complex ion into
      its central metal ion and ligands; equal to the mathematical inverse of the
      formation constant.
    composed_of:
    - formation_constant
    tier: 5
    source_domain: chemistry_ch15
  spontaneous_process:
    defines: A process that occurs naturally under a given set of conditions without
      continuous input of energy from an external source.
    composed_of:
    - heat_flow
    tier: 1
    source_domain: chemistry_ch16
  matter_and_energy_dispersal:
    defines: The tendency of matter and energy to spread out to occupy more volume
      or distribute more uniformly, which drives many spontaneous processes.
    composed_of:
    - heat_flow
    tier: 1
    source_domain: chemistry_ch16
  microstate:
    defines: A specific configuration of the locations and energies of all atoms or
      molecules comprising a system.
    composed_of:
    - state_function
    tier: 1
    source_domain: chemistry_ch16
  reversible_process:
    defines: A hypothetical process that occurs infinitely slowly, always at equilibrium,
      and whose direction can be reversed by an infinitesimally small change in conditions;
      used to define the entropy change as q_rev / T.
    composed_of:
    - equilibrium
    - heat_flow
    - temperature
    tier: 1
    source_domain: chemistry_ch16
  nonspontaneous_process:
    defines: A process that will not occur unless continuously driven by energy input
      from an external source; spontaneous in the reverse direction.
    composed_of:
    - spontaneous_process
    tier: 2
    source_domain: chemistry_ch16
  entropy:
    defines: A state function equal to Boltzmann's constant times the natural log
      of the number of microstates (S = k ln W); a measure of matter and energy dispersal
      within a system.
    composed_of:
    - microstate
    - state_function
    tier: 2
    source_domain: chemistry_ch16
  entropy_phase_dependence:
    defines: The relationship S_solid < S_liquid < S_gas, arising because each successive
      phase allows greater freedom of particle motion and more possible microstates.
    composed_of:
    - entropy
    tier: 3
    source_domain: chemistry_ch16
  entropy_temperature_dependence:
    defines: Entropy increases with rising temperature because higher temperatures
      broaden the distribution of kinetic energies, increasing the number of accessible
      microstates.
    composed_of:
    - entropy
    - temperature
    tier: 3
    source_domain: chemistry_ch16
  second_law_of_thermodynamics:
    defines: All spontaneous processes increase the total entropy of the universe
      (ΔS_univ > 0); a process with ΔS_univ < 0 is nonspontaneous, and ΔS_univ = 0
      indicates equilibrium.
    composed_of:
    - entropy
    - spontaneous_process
    - equilibrium
    tier: 3
    source_domain: chemistry_ch16
  third_law_of_thermodynamics:
    defines: The entropy of a pure, perfect crystalline substance at absolute zero
      (0 K) is zero, because only one microstate exists.
    composed_of:
    - entropy
    - temperature
    - microstate
    tier: 3
    source_domain: chemistry_ch16
  gibbs_free_energy:
    defines: A state function defined as G = H - TS whose change at constant temperature
      and pressure (ΔG = ΔH - TΔS) predicts spontaneity using system properties alone;
      ΔG < 0 is spontaneous, ΔG > 0 is nonspontaneous, ΔG = 0 is equilibrium.
    composed_of:
    - enthalpy
    - entropy
    - temperature
    - state_function
    tier: 3
    source_domain: chemistry_ch16
    also_in:
    - chemistry_ch17
  standard_entropy:
    defines: The absolute entropy of one mole of a substance at standard conditions
      (1 bar, 298.15 K), determinable by calorimetry from the third-law zero reference.
    composed_of:
    - third_law_of_thermodynamics
    tier: 4
    source_domain: chemistry_ch16
  temperature_dependence_of_spontaneity:
    defines: The way the sign of ΔG = ΔH - TΔS shifts with temperature depending on
      the signs of ΔH and ΔS, determining whether a process is spontaneous at high
      temperatures, low temperatures, all temperatures, or no temperatures.
    composed_of:
    - gibbs_free_energy
    - temperature
    tier: 4
    source_domain: chemistry_ch16
  standard_entropy_change:
    defines: The entropy change for a reaction under standard conditions, calculated
      as the sum of standard entropies of products minus reactants weighted by stoichiometric
      coefficients.
    composed_of:
    - standard_entropy
    tier: 5
    source_domain: chemistry_ch16
  standard_free_energy_change:
    defines: The free energy change for a process in which all reactants and products
      are in their standard states, computable from standard enthalpies and entropies
      or from standard free energies of formation.
    composed_of:
    - gibbs_free_energy
    - standard_entropy_change
    tier: 6
    source_domain: chemistry_ch16
  standard_free_energy_of_formation:
    defines: The free energy change accompanying formation of one mole of a substance
      from its elements in their standard states; zero by definition for pure elements
      in standard states.
    composed_of:
    - standard_free_energy_change
    tier: 7
    source_domain: chemistry_ch16
  free_energy_equilibrium_relationship:
    defines: The quantitative link ΔG° = -RT ln K relating standard free energy change
      to the equilibrium constant, and ΔG = ΔG° + RT ln Q relating free energy under
      non-standard conditions to the reaction quotient.
    composed_of:
    - standard_free_energy_change
    - gibbs_free_energy
    - equilibrium
    - reaction_quotient
    tier: 7
    source_domain: chemistry_ch16
  faradays_constant:
    defines: The total electric charge carried by one mole of electrons, equal to
      96,485 coulombs per mole, used to relate moles of electrons to charge transferred.
    composed_of:
    - electric_charge
    tier: 1
    source_domain: chemistry_ch17
  half_reaction:
    defines: An equation representing either the oxidation or the reduction component
      of a redox reaction, showing electrons explicitly as reactants or products.
    composed_of:
    - redox_reaction
    tier: 2
    source_domain: chemistry_ch17
  electrochemical_cell:
    defines: A device that either converts chemical energy from a spontaneous redox
      reaction into electrical energy (galvanic) or uses electrical energy to drive
      a nonspontaneous redox reaction (electrolytic).
    composed_of:
    - redox_reaction
    - electric_charge
    tier: 2
    source_domain: chemistry_ch17
  half_cell:
    defines: A component of an electrochemical cell containing the redox conjugate
      pair of a single reactant, where either oxidation or reduction occurs.
    composed_of:
    - electrochemical_cell
    - half_reaction
    tier: 3
    source_domain: chemistry_ch17
  anode:
    defines: The electrode in an electrochemical cell at which oxidation occurs; in
      a galvanic cell it is the negative terminal.
    composed_of:
    - electrochemical_cell
    - oxidation
    tier: 3
    source_domain: chemistry_ch17
  cathode:
    defines: The electrode in an electrochemical cell at which reduction occurs; in
      a galvanic cell it is the positive terminal.
    composed_of:
    - electrochemical_cell
    - reduction
    tier: 3
    source_domain: chemistry_ch17
  galvanic_cell:
    defines: An electrochemical cell in which a spontaneous redox reaction drives
      electron flow through an external circuit, converting chemical energy into electrical
      energy.
    composed_of:
    - electrochemical_cell
    tier: 3
    source_domain: chemistry_ch17
  active_electrode:
    defines: An electrode that participates as a reactant or product in the cell's
      redox reaction, changing in mass as the reaction proceeds.
    composed_of:
    - electrochemical_cell
    tier: 3
    source_domain: chemistry_ch17
  inert_electrode:
    defines: An electrode (e.g., platinum) that conducts electrons to and from redox
      species in solution without itself being oxidized or reduced.
    composed_of:
    - electrochemical_cell
    tier: 3
    source_domain: chemistry_ch17
  electrolytic_cell:
    defines: An electrochemical cell in which an external power source forces a nonspontaneous
      redox reaction to occur, reversing the direction of spontaneous electron flow.
    composed_of:
    - electrochemical_cell
    tier: 3
    source_domain: chemistry_ch17
  salt_bridge:
    defines: A tube filled with inert electrolyte solution that connects the two half-cells
      of a galvanic cell, allowing ion flow to maintain electrical charge neutrality
      without mixing the half-cell solutions.
    composed_of:
    - galvanic_cell
    - half_cell
    tier: 4
    source_domain: chemistry_ch17
  cell_notation:
    defines: A standardized symbolic representation of a galvanic cell listing components
      and phase interfaces from anode to cathode using vertical lines as separators.
    composed_of:
    - galvanic_cell
    - anode
    - cathode
    tier: 4
    source_domain: chemistry_ch17
  cell_potential:
    defines: The difference in electric potential between the cathode and anode half-cells
      of an electrochemical cell, measuring the driving force for the redox reaction
      in volts.
    composed_of:
    - anode
    - cathode
    tier: 4
    source_domain: chemistry_ch17
  standard_hydrogen_electrode:
    defines: A reference half-cell based on the H⁺/H₂ half-reaction under standard
      conditions, assigned a potential of exactly 0 V, used as the universal reference
      for measuring electrode potentials.
    composed_of:
    - half_cell
    tier: 4
    source_domain: chemistry_ch17
  electrolysis:
    defines: A process in which an external electrical power source applies a voltage
      to an electrolytic cell to drive an otherwise nonspontaneous redox reaction.
    composed_of:
    - electrolytic_cell
    tier: 4
    source_domain: chemistry_ch17
    also_in:
    - chemistry_ch18
  electrode_potential:
    defines: The cell potential measured when a given half-cell acts as the cathode
      connected to a standard hydrogen electrode acting as the anode, reflecting the
      relative oxidizing strength of the half-cell's reactant.
    composed_of:
    - cell_potential
    - standard_hydrogen_electrode
    tier: 5
    source_domain: chemistry_ch17
  electrolysis_stoichiometry:
    defines: The quantitative relationship between current, time, Faraday's constant,
      and reaction stoichiometry used to calculate the mass of substance produced
      or consumed during electrolysis.
    composed_of:
    - electrolysis
    - faradays_constant
    - electric_current
    tier: 5
    source_domain: chemistry_ch17
  standard_electrode_potential:
    defines: The electrode potential of a half-cell measured under standard-state
      conditions (1 M solutes, 1 bar gases, 298 K), tabulated as standard reduction
      potentials.
    composed_of:
    - electrode_potential
    tier: 6
    source_domain: chemistry_ch17
  standard_cell_potential:
    defines: The cell potential when all reactants and products are at standard-state
      conditions, calculated as E°_cathode minus E°_anode; a positive value indicates
      a spontaneous reaction.
    composed_of:
    - standard_electrode_potential
    tier: 7
    source_domain: chemistry_ch17
  free_energy_potential_relation:
    defines: The quantitative link between standard free energy change and standard
      cell potential expressed as ΔG° = −nFE°_cell, confirming that spontaneous reactions
      have positive potentials and negative free energy changes.
    composed_of:
    - gibbs_free_energy
    - standard_cell_potential
    - faradays_constant
    tier: 8
    source_domain: chemistry_ch17
  nernst_equation:
    defines: An equation relating the cell potential under nonstandard conditions
      to the standard cell potential, the number of electrons transferred, temperature,
      and the reaction quotient Q (E_cell = E°_cell − (RT/nF)ln Q).
    composed_of:
    - free_energy_potential_relation
    - reaction_quotient
    tier: 9
    source_domain: chemistry_ch17
  equilibrium_potential_relation:
    defines: The logarithmic relationship between the equilibrium constant K and the
      standard cell potential E°_cell (derived via ΔG°), showing that larger positive
      potentials correspond to reactions that proceed nearly to completion.
    composed_of:
    - free_energy_potential_relation
    - equilibrium_constant
    tier: 9
    source_domain: chemistry_ch17
  concentration_cell:
    defines: A galvanic cell whose two half-cells use the same redox couple and electrodes
      but differ only in the concentration of one species, so the cell potential arises
      solely from that concentration difference.
    composed_of:
    - galvanic_cell
    - nernst_equation
    tier: 10
    source_domain: chemistry_ch17
  metallic_character:
    defines: The tendency of an element to lose valence electrons, producing high
      electrical and thermal conductivity, malleability, and the ability to form cations.
    composed_of:
    - electron_configuration
    - ionization_energy
    tier: 1
    source_domain: chemistry_ch18
  representative_elements:
    defines: Elements in which the outermost s and p orbitals are being filled, occurring
      in groups 1, 2, and 12–18 of the periodic table.
    composed_of:
    - periodic_table_groups
    - electron_configuration
    tier: 1
    source_domain: chemistry_ch18
  nonmetals:
    defines: Elements in the upper right of the periodic table with high electronegativities
      that form anions or covalent molecular compounds and whose oxides are typically
      acid anhydrides.
    composed_of:
    - electronegativity
    - covalent_bonding
    - periodic_table_groups
    tier: 1
    source_domain: chemistry_ch18
  inert_pair_effect:
    defines: The tendency of heavier p-block elements to form stable ions with an
      oxidation state two lower than the group maximum, because the ns2 electron pair
      resists ionization.
    composed_of:
    - electron_configuration
    - ionization_energy
    - oxidation_state
    tier: 1
    source_domain: chemistry_ch18
  allotropes:
    defines: Two or more forms of the same element in the same physical state that
      differ in atomic arrangement and therefore in chemical and physical properties.
    composed_of:
    - covalent_bonding
    tier: 1
    source_domain: chemistry_ch18
  noble_gases:
    defines: Chemically inert elements with filled valence shells that exist as monatomic
      gases; the heaviest members (Kr, Xe) can form compounds with highly electronegative
      fluorine.
    composed_of:
    - electron_configuration
    - electronegativity
    tier: 1
    source_domain: chemistry_ch18
  disproportionation_reaction:
    defines: A redox reaction in which a single element in one compound is simultaneously
      oxidized and reduced, acting as both the oxidizing and reducing agent.
    composed_of:
    - oxidation_state
    tier: 1
    source_domain: chemistry_ch18
  silicates:
    defines: A large class of compounds containing silicon-oxygen tetrahedra (SiO4)
      linked by shared oxygen atoms in chains, sheets, or three-dimensional networks,
      forming the basis of most minerals, rocks, and ceramics.
    composed_of:
    - covalent_bonding
    tier: 1
    source_domain: chemistry_ch18
  nitrogen_fixation:
    defines: The conversion of atmospheric N2 into biologically or industrially useful
      nitrogen compounds, accomplished biologically by nitrogenase enzymes or industrially
      by the Haber process.
    composed_of:
    - covalent_bonding
    - oxidation_state
    tier: 1
    source_domain: chemistry_ch18
  alkali_metals:
    defines: Highly reactive metals with one valence electron that readily form 1+
      cations, react vigorously with water, and have the largest atomic radii and
      lowest ionization energies in their periods.
    composed_of:
    - representative_elements
    - metallic_character
    - ionization_energy
    tier: 2
    source_domain: chemistry_ch18
  alkaline_earth_metals:
    defines: Reactive metals with two valence electrons that form 2+ cations, are
      less reactive than alkali metals due to higher ionization energies, and whose
      oxides react with water to form alkaline solutions.
    composed_of:
    - representative_elements
    - metallic_character
    - ionization_energy
    tier: 2
    source_domain: chemistry_ch18
  passivation:
    defines: The formation of a thin, adherent film of oxide or other compound on
      a metal surface that acts as a barrier, slowing further chemical reaction with
      air or water.
    composed_of:
    - metallic_character
    - oxidation_state
    tier: 2
    source_domain: chemistry_ch18
  metalloids:
    defines: Elements (B, Si, Ge, As, Sb, Te) with properties intermediate between
      metals and nonmetals that form covalent crystals and act as electrical semiconductors.
    composed_of:
    - metallic_character
    - nonmetals
    tier: 2
    source_domain: chemistry_ch18
  acid_anhydride:
    defines: A compound (typically a nonmetal oxide) that reacts with water to form
      an acid without a change in oxidation state of the central element.
    composed_of:
    - nonmetals
    - oxidation_state
    tier: 2
    source_domain: chemistry_ch18
  halogens:
    defines: Highly electronegative, reactive nonmetals that exist as diatomic molecules,
      form halide ions with an oxidation state of 1−, and are strong oxidizing agents
      whose reactivity decreases from F2 to I2.
    composed_of:
    - nonmetals
    - electronegativity
    - oxidation_state
    tier: 2
    source_domain: chemistry_ch18
  ozone:
    defines: An allotrope of oxygen (O3) formed endothermically from O2 that acts
      as a strong oxidizing agent and shields Earth's surface from ultraviolet radiation
      in the stratosphere.
    composed_of:
    - allotropes
    - reduction_potential
    tier: 2
    source_domain: chemistry_ch18
  chemical_reduction_metals:
    defines: The isolation of a metal from its ore by reacting the ore with a more
      active reducing agent (e.g., carbon, sodium, silicon) at high temperature, generally
      less expensive than electrolysis.
    composed_of:
    - metallic_character
    - reduction_potential
    - oxidation_state
    tier: 2
    source_domain: chemistry_ch18
  amphoteric_behavior:
    defines: The ability of a substance (such as aluminum hydroxide or hydrogen carbonate)
      to react with both acids and bases, reflecting intermediate metallic-nonmetallic
      character.
    composed_of:
    - lewis_acid_base
    - metallic_character
    - nonmetals
    tier: 2
    source_domain: chemistry_ch18
  semiconductor_behavior:
    defines: The ability of metalloids to conduct electricity partially, arising because
      their electrons are more tightly bound to nuclei than in metals but less tightly
      than in insulators.
    composed_of:
    - metalloids
    tier: 3
    source_domain: chemistry_ch18
  oxyacids:
    defines: Acids containing hydrogen, oxygen, and a nonmetal element; their strength
      generally increases with the electronegativity and oxidation state of the central
      atom.
    composed_of:
    - acid_anhydride
    - electronegativity
    - oxidation_state
    tier: 3
    source_domain: chemistry_ch18
  interhalogens:
    defines: Compounds formed between two or more different halogen elements, consisting
      of one atom of the heavier halogen bonded to an odd number of atoms of a lighter
      halogen.
    composed_of:
    - halogens
    - covalent_bonding
    tier: 3
    source_domain: chemistry_ch18
  transition_metals:
    defines: Elements with partially filled d orbitals located in groups 3–11 of the
      periodic table, organized into first, second, third, and fourth transition series.
    composed_of:
    - electron_configuration
    tier: 1
    source_domain: chemistry_ch19
  inner_transition_metals:
    defines: The f-block elements—lanthanides (atomic numbers 57–71) and actinides
      (atomic numbers 89–103)—which have valence electrons in f orbitals.
    composed_of:
    - electron_configuration
    tier: 1
    source_domain: chemistry_ch19
  coordinate_covalent_bond:
    defines: A covalent bond in which both electrons are donated by a single atom
      (the Lewis base) to an electron acceptor (the Lewis acid).
    composed_of:
    - lewis_acid_base_interaction
    tier: 1
    source_domain: chemistry_ch19
    also_in:
    - chemistry_ch15
  pairing_energy:
    defines: The energy required to place two electrons with opposite spins into the
      same orbital, which competes with crystal field splitting in determining electron
      arrangement in d orbitals.
    composed_of:
    - electron_configuration
    tier: 1
    source_domain: chemistry_ch19
  transition_metal_oxidation_states:
    defines: The ability of transition metals to exist in multiple stable oxidation
      states due to the availability of both s and d valence electrons for removal.
    composed_of:
    - transition_metals
    - oxidation_state
    tier: 2
    source_domain: chemistry_ch19
  central_metal_ion:
    defines: The metal atom or ion at the core of a coordination complex that acts
      as a Lewis acid and accepts electron pairs from ligands.
    composed_of:
    - lewis_acid_base_interaction
    - transition_metals
    tier: 2
    source_domain: chemistry_ch19
  metal_extraction:
    defines: The three-stage process of preliminary treatment, smelting, and refining
      used to isolate transition metals from their ores, illustrated by iron, copper,
      and silver.
    composed_of:
    - transition_metals
    - oxidation_state
    tier: 2
    source_domain: chemistry_ch19
  transition_metal_compounds:
    defines: Binary and polyatomic compounds of transition metals—including halides,
      oxides, hydroxides, and carbonates—whose bonding character shifts from ionic
      at low oxidation states to covalent at high oxidation states.
    composed_of:
    - transition_metal_oxidation_states
    tier: 3
    source_domain: chemistry_ch19
  coordination_compound:
    defines: A stable compound in which a central metal atom or ion acts as a Lewis
      acid and accepts one or more pairs of electrons from surrounding ligands via
      coordinate covalent bonds.
    composed_of:
    - central_metal_ion
    - ligand
    tier: 3
    source_domain: chemistry_ch19
  monodentate_ligand:
    defines: A ligand that attaches to the central metal through a single coordinate
      covalent bond from one donor atom.
    composed_of:
    - ligand
    tier: 3
    source_domain: chemistry_ch19
  polydentate_ligand:
    defines: A ligand that bonds to a central metal ion through two or more donor
      atoms simultaneously, classified by the number of donor sites (bidentate, tridentate,
      etc.).
    composed_of:
    - ligand
    tier: 3
    source_domain: chemistry_ch19
  hydrometallurgy:
    defines: A metal separation process in which the metal is first converted into
      soluble ions, extracted from the ore mixture, and then reduced to precipitate
      the pure metal.
    composed_of:
    - metal_extraction
    tier: 3
    source_domain: chemistry_ch19
  coordination_sphere:
    defines: The central metal ion or atom together with all directly attached ligands,
      enclosed in brackets in the chemical formula.
    composed_of:
    - coordination_compound
    tier: 4
    source_domain: chemistry_ch19
  chelate:
    defines: A coordination complex formed when one or more polydentate ligands bond
      to a central metal ion through multiple donor atoms, creating ring-like structures.
    composed_of:
    - polydentate_ligand
    - coordination_compound
    tier: 4
    source_domain: chemistry_ch19
  nomenclature_of_complexes:
    defines: The systematic naming rules for coordination compounds based on Werner's
      system, specifying ligand names and counts, metal identity, and oxidation state.
    composed_of:
    - coordination_compound
    - oxidation_state
    tier: 4
    source_domain: chemistry_ch19
  linkage_isomers:
    defines: Coordination isomers that arise when an ambidentate ligand (such as CN⁻
      or SCN⁻) can bind to the metal through either of two different donor atoms.
    composed_of:
    - coordination_compound
    - monodentate_ligand
    tier: 4
    source_domain: chemistry_ch19
  crystal_field_theory:
    defines: An electrostatic model that explains the colors, magnetic behavior, and
      structures of coordination compounds by treating ligands as point charges that
      split the energies of the central metal's d orbitals.
    composed_of:
    - coordination_compound
    tier: 4
    source_domain: chemistry_ch19
  complex_geometry:
    defines: The spatial arrangement of ligands around the central metal ion, determined
      by coordination number, with octahedral (CN=6), square planar and tetrahedral
      (CN=4), and linear (CN=2) being most common.
    composed_of:
    - coordination_compound
    - coordination_number
    tier: 5
    source_domain: chemistry_ch19
  ionization_isomers:
    defines: Coordination isomers in which an anionic ligand inside the coordination
      sphere is exchanged with the counter-ion outside the sphere.
    composed_of:
    - coordination_sphere
    tier: 5
    source_domain: chemistry_ch19
  d_orbital_splitting:
    defines: The separation of the five d orbitals into sets of different energies
      caused by electrostatic repulsion from ligands, yielding t2g and eg sets in
      octahedral complexes.
    composed_of:
    - crystal_field_theory
    tier: 5
    source_domain: chemistry_ch19
  geometric_isomers:
    defines: Isomers of coordination complexes that have the same atoms connected
      by the same bond types but differ in spatial orientation, exemplified by cis
      and trans configurations.
    composed_of:
    - complex_geometry
    tier: 6
    source_domain: chemistry_ch19
  optical_isomers:
    defines: Pairs of coordination complexes that are nonsuperimposable mirror images
      of each other, differing only in their interaction with polarized light and
      other chiral molecules.
    composed_of:
    - complex_geometry
    tier: 6
    source_domain: chemistry_ch19
  crystal_field_splitting:
    defines: The energy difference between the eg and t2g orbital sets in an octahedral
      complex, whose magnitude depends on the identity of the ligands, the metal charge,
      and the d-orbital period.
    composed_of:
    - d_orbital_splitting
    tier: 6
    source_domain: chemistry_ch19
  spectrochemical_series:
    defines: A ranking of ligands in order of the magnitude of crystal field splitting
      they produce, from weak-field ligands (small Δoct) to strong-field ligands (large
      Δoct).
    composed_of:
    - crystal_field_splitting
    tier: 7
    source_domain: chemistry_ch19
  high_spin_low_spin_complexes:
    defines: Octahedral complexes in which electrons maximize unpaired spins by occupying
      all d orbitals before pairing (high-spin, Δoct < P) or minimize unpaired spins
      by filling lower t2g orbitals first (low-spin, Δoct > P).
    composed_of:
    - crystal_field_splitting
    - pairing_energy
    tier: 7
    source_domain: chemistry_ch19
  color_of_complexes:
    defines: The visible color exhibited by coordination compounds when d-d electron
      transitions absorb photons in the visible spectrum, with the observed color
      being complementary to the absorbed wavelengths.
    composed_of:
    - crystal_field_splitting
    tier: 7
    source_domain: chemistry_ch19
  magnetic_moment_of_complexes:
    defines: The experimentally measured magnetic property of a complex that reflects
      the number of unpaired electrons, used to confirm high-spin or low-spin assignments
      predicted by crystal field theory.
    composed_of:
    - high_spin_low_spin_complexes
    - paramagnetism_diamagnetism
    tier: 8
    source_domain: chemistry_ch19
  hydrocarbon:
    defines: The simplest class of organic compounds, composed exclusively of carbon
      and hydrogen atoms, whose diversity arises from chain length, branching, ring
      formation, and bond type.
    composed_of:
    - organic_compound
    - carbon_tetravalence
    tier: 1
    source_domain: chemistry_ch20
  condensed_structural_formula:
    defines: A shorthand representation of an organic molecule that implies connectivity
      by grouping atoms around each carbon without drawing all individual bond lines.
    composed_of:
    - organic_compound
    tier: 1
    source_domain: chemistry_ch20
  skeletal_structure:
    defines: A line-angle shorthand in which carbon atoms are represented by line
      endpoints and bends and attached hydrogen atoms are omitted but understood to
      be present.
    composed_of:
    - organic_compound
    tier: 1
    source_domain: chemistry_ch20
  structural_isomer:
    defines: Compounds sharing the same molecular formula but differing in the connectivity
      or arrangement of their atoms, such as n-butane and 2-methylpropane.
    composed_of:
    - organic_compound
    tier: 1
    source_domain: chemistry_ch20
  functional_group:
    defines: The atom or group of atoms within an organic molecule that confers specific
      and predictable chemical reactivity, used to classify organic compounds into
      families.
    composed_of:
    - organic_compound
    tier: 1
    source_domain: chemistry_ch20
  carbonyl_group:
    defines: A functional group consisting of a carbon atom double-bonded to an oxygen
      atom (C=O), with sp2-hybridized carbon in trigonal planar geometry, that is
      the defining structural unit of aldehydes, ketones, carboxylic acids, and esters.
    composed_of:
    - hybridization
    tier: 1
    source_domain: chemistry_ch20
  alkane:
    defines: A saturated hydrocarbon containing only single C-C bonds, with sp3-hybridized
      carbons, tetrahedral geometry, and the general formula CnH2n+2 for noncyclic
      structures.
    composed_of:
    - hydrocarbon
    - hybridization
    tier: 2
    source_domain: chemistry_ch20
  alkene:
    defines: An unsaturated hydrocarbon containing at least one C=C double bond composed
      of one sigma bond and one pi bond, with sp2-hybridized carbons in trigonal planar
      geometry.
    composed_of:
    - hydrocarbon
    - hybridization
    tier: 2
    source_domain: chemistry_ch20
  alkyne:
    defines: An unsaturated hydrocarbon containing at least one C-C triple bond (one
      sigma bond and two pi bonds), with sp-hybridized carbons and linear geometry.
    composed_of:
    - hydrocarbon
    - hybridization
    tier: 2
    source_domain: chemistry_ch20
  aromatic_hydrocarbon:
    defines: A cyclic hydrocarbon with delocalized pi electrons described by resonance
      structures, exhibiting bond lengths and energies intermediate between single
      and double bonds, and preferring substitution reactions over addition reactions.
    composed_of:
    - hydrocarbon
    - resonance_structure
    tier: 2
    source_domain: chemistry_ch20
  alcohol:
    defines: A hydrocarbon derivative in which a hydroxyl group (-OH) is covalently
      bonded to a carbon atom, named by replacing the terminal -e of the parent alkane
      with -ol.
    composed_of:
    - hydrocarbon
    - functional_group
    tier: 2
    source_domain: chemistry_ch20
  amine:
    defines: An organic compound in which a nitrogen atom bearing a lone pair of electrons
      is bonded to one or more carbon or hydrogen atoms, making it a weak base analogous
      to ammonia.
    composed_of:
    - organic_compound
    - functional_group
    tier: 2
    source_domain: chemistry_ch20
  alkyl_group:
    defines: A substituent derived from an alkane by removing one hydrogen atom, named
      by replacing the -ane suffix with -yl; alkyl groups exist only as parts of larger
      molecules.
    composed_of:
    - alkane
    tier: 3
    source_domain: chemistry_ch20
  geometric_isomer:
    defines: A pair of isomers with identical atomic connectivity but different orientations
      of substituents about a rigid C=C double bond, designated cis (same side) or
      trans (opposite sides).
    composed_of:
    - alkene
    - structural_isomer
    tier: 3
    source_domain: chemistry_ch20
  substitution_reaction:
    defines: A reaction in which one atom or group replaces another in a molecule
      without breaking C-C bonds or changing carbon hybridization, characteristic
      of alkanes reacting with halogens.
    composed_of:
    - alkane
    - functional_group
    tier: 3
    source_domain: chemistry_ch20
  addition_reaction:
    defines: A reaction characteristic of alkenes and alkynes in which a pi bond is
      broken and atoms of a reagent add across the multiple bond to form two new sigma
      bonds, converting sp2 (or sp) carbons to sp3.
    composed_of:
    - alkene
    - alkyne
    tier: 3
    source_domain: chemistry_ch20
  ether:
    defines: An organic compound containing an oxygen atom bonded by single bonds
      to two separate carbon groups (R-O-R), formed by the dehydration of two alcohol
      molecules.
    composed_of:
    - alcohol
    tier: 3
    source_domain: chemistry_ch20
  oxidation_reduction_organic:
    defines: In organic molecules, oxidation is the replacement of a C-H bond with
      a C-O bond (raising the carbon oxidation state), and reduction is the reverse;
      this framework describes the progression from alkane to alcohol to aldehyde
      to carboxylic acid.
    composed_of:
    - oxidation_number
    - alcohol
    tier: 3
    source_domain: chemistry_ch20
  iupac_nomenclature:
    defines: A systematic naming system in which organic compounds are named by identifying
      the longest carbon chain, numbering from the end nearest a substituent, and
      listing substituents with position numbers and alphabetical order.
    composed_of:
    - alkyl_group
    - functional_group
    tier: 4
    source_domain: chemistry_ch20
  aldehyde:
    defines: An organic compound in which the carbonyl group is bonded to at least
      one hydrogen atom (-CHO), formed by oxidation of a primary alcohol, and named
      with the suffix -al.
    composed_of:
    - carbonyl_group
    - oxidation_reduction_organic
    tier: 4
    source_domain: chemistry_ch20
  ketone:
    defines: An organic compound in which the carbonyl group is bonded to two carbon
      substituents (-CO-), formed by oxidation of a secondary alcohol, and named with
      the suffix -one.
    composed_of:
    - carbonyl_group
    - oxidation_reduction_organic
    tier: 4
    source_domain: chemistry_ch20
  carboxylic_acid:
    defines: An organic compound containing a carbonyl carbon bonded to a hydroxyl
      group (-CO2H), acting as a weak acid in water and prepared by oxidation of an
      aldehyde or primary alcohol.
    composed_of:
    - aldehyde
    tier: 5
    source_domain: chemistry_ch20
  ester:
    defines: An organic compound in which the carbonyl carbon is bonded to an oxygen
      atom that is itself bonded to a carbon substituent (-CO2R), produced by reaction
      of a carboxylic acid with an alcohol.
    composed_of:
    - carboxylic_acid
    - alcohol
    tier: 6
    source_domain: chemistry_ch20
  amide:
    defines: An organic compound in which a nitrogen atom is bonded directly to the
      carbon of a carbonyl group, formed by condensation of a carboxylic acid with
      an amine with elimination of water.
    composed_of:
    - carboxylic_acid
    - amine
    tier: 6
    source_domain: chemistry_ch20
  nucleon:
    defines: The collective term for protons and neutrons as constituents of an atomic
      nucleus.
    composed_of:
    - proton
    - neutron
    tier: 1
    source_domain: chemistry_ch21
  gamma_ray:
    defines: High-energy electromagnetic radiation emitted when a nucleus transitions
      from an excited state to a lower energy state; has no mass or charge.
    composed_of:
    - electromagnetic_radiation
    tier: 1
    source_domain: chemistry_ch21
  beta_particle:
    defines: A high-energy electron emitted from a nucleus when a neutron is converted
      into a proton during beta decay.
    composed_of:
    - electron
    - neutron
    - proton
    tier: 1
    source_domain: chemistry_ch21
  positron:
    defines: The antiparticle of the electron; a positively charged particle of equal
      mass emitted during positron emission (β⁺ decay).
    composed_of:
    - electron
    tier: 1
    source_domain: chemistry_ch21
  nuclide:
    defines: A nucleus characterized by a specific number of protons and neutrons,
      identified by nuclide notation (symbol, mass number, atomic number).
    composed_of:
    - atomic_number
    - mass_number
    - nucleon
    tier: 2
    source_domain: chemistry_ch21
  alpha_particle:
    defines: A high-energy helium-4 nucleus (two protons, two neutrons) emitted during
      certain nuclear decay reactions.
    composed_of:
    - nucleon
    tier: 2
    source_domain: chemistry_ch21
  strong_nuclear_force:
    defines: The short-range attractive force between nucleons that overcomes electrostatic
      repulsion among protons and holds the nucleus together.
    composed_of:
    - nucleon
    - proton
    tier: 2
    source_domain: chemistry_ch21
  magic_numbers:
    defines: Specific nucleon counts (2, 8, 20, 28, 50, 82, 126) that complete nuclear
      shells, conferring exceptional stability against radioactive decay.
    composed_of:
    - nucleon
    tier: 2
    source_domain: chemistry_ch21
  antimatter:
    defines: Particles with the same mass as their ordinary counterparts but with
      opposite properties (e.g., charge); annihilates with ordinary matter to produce
      energy.
    composed_of:
    - positron
    - mass_energy_equivalence
    tier: 2
    source_domain: chemistry_ch21
  np_ratio:
    defines: The ratio of neutrons to protons in a nucleus; stable lighter nuclei
      have a ratio near 1:1, while heavier stable nuclei require increasing neutron
      excess.
    composed_of:
    - nuclide
    tier: 3
    source_domain: chemistry_ch21
  mass_defect:
    defines: The difference between the calculated mass of a nucleus's constituent
      nucleons and the experimentally measured mass of the nucleus, representing mass
      converted to binding energy.
    composed_of:
    - nucleon
    - nuclide
    tier: 3
    source_domain: chemistry_ch21
  nuclear_density:
    defines: The extremely high mass per unit volume of an atomic nucleus, averaging
      approximately 1.8 × 10¹⁴ g/cm³.
    composed_of:
    - nucleon
    - nuclide
    tier: 3
    source_domain: chemistry_ch21
  nuclear_reaction:
    defines: A process that changes a nucleus's atomic number, mass number, or energy
      state, conserving both total mass number and total charge across reactants and
      products.
    composed_of:
    - nuclide
    - atomic_number
    - mass_number
    tier: 3
    source_domain: chemistry_ch21
  ionizing_radiation:
    defines: Radiation (alpha, beta, gamma particles, X-rays) energetic enough to
      eject electrons from atoms or molecules, capable of breaking chemical bonds
      and damaging biological systems.
    composed_of:
    - alpha_particle
    - beta_particle
    - gamma_ray
    tier: 3
    source_domain: chemistry_ch21
  balancing_nuclear_equations:
    defines: The method of writing nuclear reactions such that the sum of mass numbers
      and the sum of atomic numbers are each equal on both sides of the equation.
    composed_of:
    - nuclear_reaction
    - atomic_number
    - mass_number
    tier: 4
    source_domain: chemistry_ch21
  nuclear_binding_energy:
    defines: The energy released when nucleons are bound together to form a nucleus,
      equal to the energy required to break the nucleus into its constituent protons
      and neutrons.
    composed_of:
    - mass_defect
    - mass_energy_equivalence
    tier: 4
    source_domain: chemistry_ch21
  band_of_stability:
    defines: The narrow region on a plot of neutron number versus proton number that
      contains all known stable nuclides, reflecting favorable neutron-to-proton ratios.
    composed_of:
    - nuclide
    - np_ratio
    tier: 4
    source_domain: chemistry_ch21
  nuclear_transmutation:
    defines: The conversion of one nuclide into another by bombarding it with nuclei,
      neutrons, or other high-speed particles, often using a particle accelerator.
    composed_of:
    - nuclear_reaction
    tier: 4
    source_domain: chemistry_ch21
  radiation_biological_effects:
    defines: The damage to living organisms caused by ionizing radiation through direct
      ionization of biomolecules or indirect generation of reactive hydroxyl radicals,
      affecting rapidly dividing cells most severely.
    composed_of:
    - ionizing_radiation
    tier: 4
    source_domain: chemistry_ch21
  binding_energy_per_nucleon:
    defines: The total nuclear binding energy divided by the number of nucleons, used
      as a measure of nuclear stability; peaks near mass number 56.
    composed_of:
    - nuclear_binding_energy
    - nucleon
    tier: 5
    source_domain: chemistry_ch21
  nuclear_fission:
    defines: The splitting of a heavy nucleus into two or more lighter nuclei of intermediate
      mass, accompanied by release of neutrons and a very large amount of energy due
      to mass-to-energy conversion.
    composed_of:
    - nuclear_reaction
    - mass_energy_equivalence
    - nuclear_binding_energy
    tier: 5
    source_domain: chemistry_ch21
  nuclear_fusion:
    defines: The combination of very light nuclei into a heavier nucleus at extremely
      high temperatures, releasing large amounts of energy from mass-to-energy conversion.
    composed_of:
    - nuclear_reaction
    - mass_energy_equivalence
    - nuclear_binding_energy
    tier: 5
    source_domain: chemistry_ch21
  particle_accelerator:
    defines: A device that uses electric and magnetic fields to accelerate charged
      nuclear particles to the kinetic energies needed to initiate transmutation reactions.
    composed_of:
    - nuclear_transmutation
    tier: 5
    source_domain: chemistry_ch21
  transuranium_elements:
    defines: Synthetic elements with atomic numbers greater than 92 (uranium), all
      produced by nuclear transmutation reactions and not found naturally on Earth.
    composed_of:
    - nuclear_transmutation
    - atomic_number
    tier: 5
    source_domain: chemistry_ch21
  relative_biological_effectiveness:
    defines: A dimensionless factor that weights radiation dose by the type of radiation
      to reflect differing biological damage; alpha particles carry RBE ≈ 20, beta
      and gamma carry RBE ≈ 1.
    composed_of:
    - ionizing_radiation
    - radiation_biological_effects
    tier: 5
    source_domain: chemistry_ch21
  nuclear_stability:
    defines: The resistance of a nucleus to spontaneous transformation, correlated
      with even nucleon numbers, magic numbers, and high binding energy per nucleon.
    composed_of:
    - magic_numbers
    - np_ratio
    - binding_energy_per_nucleon
    tier: 6
    source_domain: chemistry_ch21
  chain_reaction:
    defines: A self-propagating series of fission events in which neutrons released
      by each fission event induce fission in additional nuclei, sustaining or amplifying
      the reaction.
    composed_of:
    - nuclear_fission
    tier: 6
    source_domain: chemistry_ch21
  radioactive_decay:
    defines: The spontaneous transformation of an unstable nuclide (parent) into a
      more stable nuclide (daughter) with the emission of radiation.
    composed_of:
    - nuclide
    - nuclear_stability
    - nuclear_reaction
    tier: 7
    source_domain: chemistry_ch21
  critical_mass:
    defines: The minimum amount of fissile material needed to sustain a self-sustaining
      nuclear chain reaction, dependent on material purity, geometry, and neutron
      control.
    composed_of:
    - chain_reaction
    tier: 7
    source_domain: chemistry_ch21
  parent_daughter_nuclide:
    defines: The parent nuclide is the unstable nucleus that undergoes radioactive
      decay; the daughter nuclide is the product nucleus formed, which may itself
      be stable or radioactive.
    composed_of:
    - nuclide
    - radioactive_decay
    tier: 8
    source_domain: chemistry_ch21
  alpha_decay:
    defines: A mode of radioactive decay in which a nucleus emits an alpha particle,
      decreasing its mass number by 4 and atomic number by 2; occurs primarily in
      heavy nuclei (A > 200).
    composed_of:
    - radioactive_decay
    - alpha_particle
    tier: 8
    source_domain: chemistry_ch21
  beta_decay:
    defines: A mode of radioactive decay in which a neutron is converted to a proton
      with emission of a beta particle, increasing atomic number by 1 without changing
      mass number.
    composed_of:
    - radioactive_decay
    - beta_particle
    tier: 8
    source_domain: chemistry_ch21
  gamma_emission:
    defines: The release of a gamma-ray photon when an excited-state nucleus relaxes
      to its ground state, without changing mass number or atomic number.
    composed_of:
    - radioactive_decay
    - gamma_ray
    tier: 8
    source_domain: chemistry_ch21
  positron_emission:
    defines: A mode of radioactive decay in which a proton is converted to a neutron
      with emission of a positron, decreasing atomic number by 1 without changing
      mass number; occurs in proton-rich nuclei.
    composed_of:
    - radioactive_decay
    - positron
    tier: 8
    source_domain: chemistry_ch21
  electron_capture:
    defines: A mode of radioactive decay in which an inner-shell electron combines
      with a nuclear proton to form a neutron, decreasing atomic number by 1 with
      no mass number change and emitting an X-ray.
    composed_of:
    - radioactive_decay
    - electron
    tier: 8
    source_domain: chemistry_ch21
  nuclear_reactor:
    defines: A controlled environment for sustained nuclear fission consisting of
      nuclear fuel, a moderator to slow neutrons, control rods to regulate reaction
      rate, a coolant, and a containment shield.
    composed_of:
    - chain_reaction
    - nuclear_fission
    - critical_mass
    tier: 8
    source_domain: chemistry_ch21
  radiation_units:
    defines: Standardized units for quantifying radioactive decay (becquerel, curie),
      absorbed dose (gray, rad), and biologically effective dose (sievert, rem, using
      the RBE weighting factor).
    composed_of:
    - radioactive_decay
    - ionizing_radiation
    - relative_biological_effectiveness
    tier: 8
    source_domain: chemistry_ch21
  decay_constant:
    defines: The proportionality constant λ in the first-order decay rate law (decay
      rate = λN), related to half-life by λ = ln 2 / t½.
    composed_of:
    - half_life
    tier: 9
    source_domain: chemistry_ch21
  radioactive_decay_series:
    defines: A chain of successive radioactive decays starting from a long-lived parent
      nuclide and proceeding through multiple daughter nuclides until a stable end-product
      (typically a stable lead isotope) is reached.
    composed_of:
    - radioactive_decay
    - parent_daughter_nuclide
    tier: 9
    source_domain: chemistry_ch21
  radioactive_decay_kinetics:
    defines: The mathematical description of nuclear decay as a first-order process,
      yielding Nt = N0·e^(−λt) and allowing calculation of remaining activity over
      time.
    composed_of:
    - decay_constant
    - first_order_kinetics
    tier: 10
    source_domain: chemistry_ch21
  radiometric_dating:
    defines: A technique for determining the age of materials by measuring the ratio
      of a radioactive parent nuclide to its stable decay products and applying known
      half-life values.
    composed_of:
    - radioactive_decay_kinetics
    - parent_daughter_nuclide
    tier: 11
    source_domain: chemistry_ch21
  radiocarbon_dating:
    defines: A radiometric dating method using the known half-life of carbon-14 (5730
      years) and the C-14:C-12 ratio in a formerly living sample to estimate its age
      (accurate to ~50,000 years).
    composed_of:
    - radiometric_dating
    - isotope
    tier: 12
    source_domain: chemistry_ch21
applications:
  temperature_scale_conversion:
    defines: The application of linear equations (derived from reference points) to
      convert temperature values among the Celsius, Fahrenheit, and kelvin scales.
    needs:
    - temperature
    - dimensional_analysis
    tier: 4
    source_domain: chemistry_ch01
  periodic_table:
    defines: A tabular arrangement of elements organized so that elements with similar
      chemical and physical properties appear close together.
    needs:
    - element
    - compound
    - physical_property
    - chemical_property
    tier: 4
    source_domain: chemistry_ch01
  density_calculation:
    defines: The application of the density formula and dimensional analysis to determine
      an object's density from measured mass and volume, or to find mass or volume
      given the other two quantities.
    needs:
    - density
    - dimensional_analysis
    - significant_figures
    tier: 5
    source_domain: chemistry_ch01
  mass_spectrometry:
    defines: An analytical technique that vaporizes and ionizes a sample, then separates
      ions by mass-to-charge ratio to identify isotopes and their natural abundances.
    needs:
    - ion
    - isotope
    - average_atomic_mass
    tier: 8
    source_domain: chemistry_ch02
  chemical_nomenclature:
    defines: A systematic set of rules for naming ionic and molecular compounds, including
      binary compounds, compounds with polyatomic ions, hydrates, binary acids, and
      oxyacids.
    needs:
    - ionic_compound
    - molecular_compound
    - polyatomic_ion
    tier: 8
    source_domain: chemistry_ch02
  predicting_ion_formation:
    defines: Using an element's group number to forecast the charge and type of ion
      it will form, with metals losing electrons to match the preceding noble gas
      and nonmetals gaining electrons to match the following noble gas.
    needs:
    - element_families
    - ion
    tier: 9
    source_domain: chemistry_ch02
  mass_mole_conversion:
    defines: The interconversion between a substance's mass and its amount in moles
      using molar mass as the conversion factor.
    needs:
    - molar_mass
    - mole
    tier: 3
    source_domain: chemistry_ch03
  dilution_equation:
    defines: The relationship C₁V₁ = C₂V₂ expressing conservation of moles of solute
      when a solution is diluted from an initial concentration and volume to a final
      concentration and volume.
    needs:
    - dilution
    - molarity
    tier: 3
    source_domain: chemistry_ch03
  gravimetric_analysis:
    defines: A quantitative analytical method in which the analyte is separated from
      the sample by a physical or chemical process and its concentration is determined
      from mass measurements of the isolated species.
    needs:
    - stoichiometry
    - molar_mass
    tier: 3
    source_domain: chemistry_ch04
  titration_analysis:
    defines: A quantitative analytical technique in which the volume of a titrant
      solution of known concentration required to completely react with an analyte
      is measured and used to calculate the analyte's concentration.
    needs:
    - molarity
    - stoichiometry
    - equivalence_point
    tier: 4
    source_domain: chemistry_ch04
  combustion_reaction:
    defines: A vigorous redox reaction between a fuel (reductant) and an oxidant that
      releases significant heat and often produces a visible flame.
    needs:
    - redox_reaction
    tier: 4
    source_domain: chemistry_ch04
  atom_economy:
    defines: A measure of synthetic efficiency defined as the percentage by mass of
      the desired final product relative to the total mass of all reactants used.
    needs:
    - stoichiometry
    - theoretical_yield
    tier: 5
    source_domain: chemistry_ch04
  combustion_analysis:
    defines: A gravimetric technique for determining the elemental composition of
      a compound by completely combusting a known mass of the sample and measuring
      the masses of the resulting gaseous products.
    needs:
    - combustion_reaction
    - gravimetric_analysis
    tier: 5
    source_domain: chemistry_ch04
  solar_thermal_energy_storage:
    defines: The application of high-heat-capacity materials (such as molten salts)
      to store solar heat and release it as electricity after sunlight is unavailable.
    needs:
    - heat_capacity
    - specific_heat_capacity
    tier: 5
    source_domain: chemistry_ch05
  metal_identification_by_specific_heat:
    defines: The application of calorimetry to determine an unknown metal's specific
      heat and compare it to tabulated values to infer the metal's identity.
    needs:
    - calorimetry
    - specific_heat_capacity
    tier: 5
    source_domain: chemistry_ch05
  nutritional_calorie:
    defines: The unit of food energy equal to 1 kilocalorie (1000 cal or 4184 J),
      determined experimentally by bomb calorimetry of food samples.
    needs:
    - bomb_calorimeter
    - heat
    tier: 6
    source_domain: chemistry_ch05
  reaction_enthalpy_from_formation_data:
    defines: The application of Hess's law to calculate the standard enthalpy of any
      reaction as the sum of product formation enthalpies minus the sum of reactant
      formation enthalpies.
    needs:
    - hess_law
    - standard_enthalpy_of_formation
    tier: 8
    source_domain: chemistry_ch05
  periodic_table_blocks:
    defines: The classification of elements into s-block, p-block, d-block, and f-block
      based on the subshell receiving the last Aufbau electron.
    needs:
    - electron_configuration
    - aufbau_principle
    - angular_momentum_quantum_number
    - principal_quantum_number
    tier: 18
    source_domain: chemistry_ch06
  ion_electron_configuration:
    defines: The electron configurations of cations (formed by removing ns or np electrons
      last added) and anions (formed by adding electrons following the Aufbau principle),
      derived from the parent atom's configuration.
    needs:
    - electron_configuration
    - aufbau_principle
    - valence_electrons
    - core_electrons
    tier: 19
    source_domain: chemistry_ch06
  isoelectronic_species:
    defines: Atoms or ions that have identical electron configurations; among isoelectronic
      ions, the greater the nuclear charge, the smaller the radius.
    needs:
    - electron_configuration
    - effective_nuclear_charge
    - ionic_radius
    tier: 19
    source_domain: chemistry_ch06
  periodic_trends:
    defines: The systematic variation of atomic radius, ionization energy, and electron
      affinity across periods and down groups of the periodic table, explained by
      changes in effective nuclear charge and principal quantum number.
    needs:
    - covalent_radius
    - ionization_energy
    - electron_affinity
    - effective_nuclear_charge
    tier: 19
    source_domain: chemistry_ch06
  enthalpy_estimation_bond_energies:
    defines: An approximation method for calculating the enthalpy change of a reaction
      by summing the energies of bonds broken minus the energies of bonds formed.
    needs:
    - bond_energy
    tier: 4
    source_domain: chemistry_ch07
  born_haber_cycle:
    defines: An application of Hess's law that constructs a thermochemical cycle from
      sublimation, ionization, bond dissociation, electron affinity, and formation
      enthalpies to calculate lattice energies indirectly.
    needs:
    - lattice_energy
    - ionization_energy
    - electron_affinity
    - bond_energy
    tier: 5
    source_domain: chemistry_ch07
  polar_molecule:
    defines: A molecule with a nonzero net dipole moment resulting from polar bonds
      arranged asymmetrically, causing it to interact with electric fields.
    needs:
    - molecular_dipole_moment
    - molecular_structure
    tier: 8
    source_domain: chemistry_ch07
  homonuclear_diatomic_mo_configurations:
    defines: The application of molecular orbital theory to period-2 diatomic molecules
      (H2 through Ne2) to predict bond orders, stability, and magnetic properties
      from filled MO diagrams.
    needs:
    - molecular_orbital_theory
    - bond_order
    - sp_mixing
    - paramagnetism
    - diamagnetism
    tier: 6
    source_domain: chemistry_ch08
  band_theory:
    defines: The extension of molecular orbital concepts to macroscopic solids, where
      vast numbers of MOs merge into continuous valence and conduction bands whose
      gap size determines whether a material is a conductor, semiconductor, or insulator.
    needs:
    - molecular_orbital_theory
    tier: 5
    source_domain: chemistry_ch08
  computational_chemistry_drug_design:
    defines: The use of molecular orbital calculations and bonding models to predict
      how potential drug molecules fit and bind to biological target sites, accelerating
      pharmaceutical discovery.
    needs:
    - molecular_orbital_theory
    tier: 5
    source_domain: chemistry_ch08
  barometer:
    defines: A device using a mercury column in an evacuated tube to measure atmospheric
      pressure by applying the hydrostatic pressure relation.
    needs:
    - atmospheric_pressure
    - hydrostatic_pressure
    tier: 3
    source_domain: chemistry_ch09
  manometer:
    defines: A U-tube device containing liquid mercury used to measure the pressure
      of a trapped gas sample from the difference in liquid column heights.
    needs:
    - hydrostatic_pressure
    - atmospheric_pressure
    tier: 3
    source_domain: chemistry_ch09
  molar_mass_determination:
    defines: An experimental procedure using measured P, V, T, and mass of a gas sample
      with the ideal gas law to calculate an unknown molar mass.
    needs:
    - ideal_gas_law
    - molar_mass
    tier: 4
    source_domain: chemistry_ch09
    also_in:
    - chemistry_ch11
  gas_stoichiometry:
    defines: The use of the ideal gas law and Avogadro's law to convert between volumes,
      moles, and masses of gaseous reactants and products in chemical reactions.
    needs:
    - ideal_gas_law
    - molar_mass
    tier: 4
    source_domain: chemistry_ch09
  uranium_enrichment_by_diffusion:
    defines: An industrial cascade process exploiting the slight effusion rate difference
      between 235UF6 and 238UF6 through porous barriers to enrich uranium in the fissile
      isotope.
    needs:
    - grahams_law
    tier: 4
    source_domain: chemistry_ch09
  gas_collection_over_water:
    defines: A laboratory technique for collecting water-insoluble gases by water
      displacement, using Dalton's law to subtract vapor pressure and obtain the dry
      gas pressure.
    needs:
    - daltons_law
    - vapor_pressure_of_water
    tier: 6
    source_domain: chemistry_ch09
  capillary_rise_equation:
    defines: A quantitative relationship giving the height a liquid rises in a capillary
      tube as a function of surface tension, contact angle, tube radius, liquid density,
      and gravity.
    needs:
    - capillary_action
    - surface_tension
    tier: 4
    source_domain: chemistry_ch10
  dna_hydrogen_bonding:
    defines: An application of hydrogen bonding in which complementary base pairs
      in the DNA double helix are held together by two or three hydrogen bonds per
      pair, enabling replication.
    needs:
    - hydrogen_bonding
    tier: 4
    source_domain: chemistry_ch10
  freeze_drying:
    defines: An application of sublimation below the triple point of water in which
      ice is removed from a material by reducing pressure so that it sublimes directly
      without melting.
    needs:
    - sublimation_and_deposition
    - triple_point
    tier: 4
    source_domain: chemistry_ch10
  semiconductor_doping:
    defines: An application of intentional crystal defect introduction in which trace
      impurities are added to silicon to tailor its electrical conductivity for use
      in computer chips.
    needs:
    - crystal_defects
    tier: 3
    source_domain: chemistry_ch10
  supercritical_co2_extraction:
    defines: An industrial application of supercritical fluid properties in which
      CO₂ above its critical point selectively dissolves and extracts compounds such
      as caffeine from coffee beans.
    needs:
    - supercritical_fluid
    tier: 5
    source_domain: chemistry_ch10
  reverse_osmosis:
    defines: A water-purification process in which pressure exceeding the osmotic
      pressure is applied to a solution, forcing solvent through a semipermeable membrane
      and leaving solutes behind.
    needs:
    - osmotic_pressure
    tier: 6
    source_domain: chemistry_ch11
  distillation:
    defines: A separation technique that exploits differences in component vapor pressures
      to selectively vaporize, condense, and collect the more volatile component of
      a solution.
    needs:
    - vapor_pressure_lowering
    - raoults_law
    tier: 7
    source_domain: chemistry_ch11
  decompression_sickness:
    defines: A physiological hazard in which gases dissolved in a diver's blood at
      high pressure form bubbles upon rapid ascent, explained by Henry's law.
    needs:
    - henrys_law
    tier: 7
    source_domain: chemistry_ch11
  deicing:
    defines: The practical use of ionic solutes (NaCl, CaCl2) to lower the freezing
      point of water on roads and aircraft surfaces, exploiting freezing point depression.
    needs:
    - freezing_point_depression
    - electrolyte
    tier: 8
    source_domain: chemistry_ch11
  soap_detergent_action:
    defines: The mechanism by which amphiphilic soap or detergent molecules orient
      at the oil-water interface, suspending nonpolar dirt as colloidal particles
      that are rinsed away.
    needs:
    - amphiphilic_molecule
    - colloid
    - emulsion
    tier: 8
    source_domain: chemistry_ch11
  enzyme_catalysis:
    defines: Biological catalysis by protein molecules that bind specific substrates
      at an active site to accelerate metabolic reactions, modeled by lock-and-key
      or induced-fit mechanisms.
    needs:
    - catalyst
    - reaction_mechanism
    tier: 5
    source_domain: chemistry_ch12
  radioactive_decay_kinetics:
    defines: The application of first-order integrated rate laws and half-life calculations
      to the decay of radioactive isotopes such as iodine-131 and carbon-14.
    needs:
    - first_order_kinetics
    - half_life
    tier: 6
    source_domain: chemistry_ch12
  haber_bosch_process:
    defines: Industrial ammonia synthesis exploiting Le Châtelier's principle via
      high pressure, moderate temperature, and a catalyst to maximize yield despite
      small K.
    needs:
    - pressure_volume_stress
    - temperature_stress
    - catalyst_effect_on_equilibrium
    tier: 6
    source_domain: chemistry_ch13
  carbonated_beverage_equilibrium:
    defines: CO2 dissolution equilibrium in beverages controlled by sealing under
      high CO2 pressure; opening releases CO2 as the system re-equilibrates.
    needs:
    - concentration_stress
    - pressure_volume_stress
    tier: 6
    source_domain: chemistry_ch13
  pharmaceutical_equilibrium:
    defines: Quantitative equilibrium calculations applied to determine drug concentrations
      across multiple simultaneous equilibria in body systems.
    needs:
    - ice_table_method
    - coupled_equilibria
    tier: 5
    source_domain: chemistry_ch13
  ph_measurement_tools:
    defines: Instruments and materials for experimentally determining solution pH,
      including electronic pH meters and colorimetric pH paper or universal indicator
      solutions.
    needs:
    - ph_scale
    tier: 2
    source_domain: chemistry_ch14
  acid_rain:
    defines: Precipitation with pH below 5 from dissolution of atmospheric SO2, SO3,
      and NOx to form sulfuric and nitric acids; illustrates environmental consequences
      of acid-base chemistry.
    needs:
    - ph_scale
    - acidic_basic_neutral_classification
    tier: 4
    source_domain: chemistry_ch14
  blood_buffer_system:
    defines: The carbonic acid/bicarbonate conjugate pair that buffers human blood
      near pH 7.4, supplemented by respiratory regulation of dissolved CO2 to maintain
      acid-base balance.
    needs:
    - buffer_solution
    - henderson_hasselbalch_equation
    tier: 6
    source_domain: chemistry_ch14
  acid_enhanced_dissolution:
    defines: The increase in solubility of a sparingly soluble salt with a basic anion
      when placed in acidic solution, because the acid consumes the basic anion and
      drives the dissolution equilibrium to the right.
    needs:
    - solubility_equilibrium
    - le_chateliers_principle
    - coupled_equilibria
    tier: 2
    source_domain: chemistry_ch15
  selective_precipitation:
    defines: A technique for separating ions in solution by incrementally raising
      the concentration of a counter-ion so that compounds precipitate one at a time
      in order of their Ksp values.
    needs:
    - precipitation_prediction
    - le_chateliers_principle
    tier: 4
    source_domain: chemistry_ch15
  complex_ion_enhanced_dissolution:
    defines: The increase in solubility of a sparingly soluble salt when ligands present
      in solution form a stable complex ion with the dissolved metal cation, reducing
      its free concentration and driving further dissolution.
    needs:
    - solubility_equilibrium
    - complex_ion
    - coupled_equilibria
    tier: 4
    source_domain: chemistry_ch15
  predicting_entropy_sign:
    defines: Using qualitative rules (phase changes, temperature changes, dissolution,
      changes in moles of gas) to determine whether a chemical or physical process
      increases or decreases entropy.
    needs:
    - entropy
    - entropy_phase_dependence
    - entropy_temperature_dependence
    tier: 4
    source_domain: chemistry_ch16
  calculating_delta_s_standard:
    defines: Computing ΔS° for a reaction by summing tabulated S° values of products
      minus reactants, weighted by stoichiometric coefficients.
    needs:
    - standard_entropy_change
    tier: 6
    source_domain: chemistry_ch16
  boiling_point_estimation:
    defines: Setting ΔG = 0 (equilibrium between liquid and gas phases) and solving
      T = ΔH° / ΔS° using standard enthalpy and entropy data to estimate normal boiling
      points.
    needs:
    - gibbs_free_energy
    - standard_entropy_change
    - enthalpy
    tier: 6
    source_domain: chemistry_ch16
  coupled_reactions:
    defines: The strategy of combining a thermodynamically unfavorable reaction with
      a favorable one so the overall ΔG° is negative, enabling a nonspontaneous process
      to proceed.
    needs:
    - standard_free_energy_change
    - gibbs_free_energy
    - nonspontaneous_process
    tier: 7
    source_domain: chemistry_ch16
  equilibrium_constant_from_free_energy:
    defines: Using ΔG° = -RT ln K to derive equilibrium constants (including Ksp and
      Kp) from standard free energy data, or vice versa.
    needs:
    - free_energy_equilibrium_relationship
    tier: 8
    source_domain: chemistry_ch16
  battery:
    defines: A galvanic cell or series of galvanic cells engineered to serve as a
      portable source of electrical power, available as nonrechargeable primary cells
      or rechargeable secondary cells.
    needs:
    - galvanic_cell
    tier: 4
    source_domain: chemistry_ch17
  fuel_cell:
    defines: A galvanic device that continuously converts the chemical energy of a
      fuel (e.g., hydrogen) and an oxidant into electricity through electrochemical
      reactions, typically with efficiency far exceeding internal combustion engines.
    needs:
    - galvanic_cell
    tier: 4
    source_domain: chemistry_ch17
  corrosion:
    defines: The spontaneous electrochemical degradation of a metal through oxidation
      by environmental agents such as oxygen and water, forming a galvanic cell at
      the metal surface.
    needs:
    - galvanic_cell
    - oxidation
    tier: 4
    source_domain: chemistry_ch17
  galvanization:
    defines: A corrosion-prevention method in which iron or steel is coated with a
      layer of zinc that oxidizes preferentially, protecting the underlying metal.
    needs:
    - corrosion
    - oxidation
    tier: 5
    source_domain: chemistry_ch17
  cathodic_protection:
    defines: A corrosion-prevention strategy in which the metal to be protected is
      made the cathode of a galvanic cell by connecting it to a more easily oxidized
      sacrificial anode (e.g., zinc or magnesium).
    needs:
    - corrosion
    - galvanic_cell
    - cathode
    - anode
    tier: 5
    source_domain: chemistry_ch17
  electroplating:
    defines: An electrolytic process in which a thin metal coating is deposited onto
      a conducting surface by reducing metal ions from solution at the cathode, used
      to improve corrosion resistance, appearance, or surface properties.
    needs:
    - electrolysis
    - cathode
    tier: 5
    source_domain: chemistry_ch17
  sacrificial_anode:
    defines: A method of preventing corrosion by attaching a more active metal (Mg,
      Al, or Zn) to the metal being protected; corrosion occurs at the sacrificial
      anode instead of at the protected cathode.
    needs:
    - metallic_character
    - reduction_potential
    tier: 2
    source_domain: chemistry_ch18
  hall_heroult_cell:
    defines: An electrolytic cell in which purified aluminum oxide dissolved in molten
      cryolite is reduced at the cathode to produce metallic aluminum, the industrial
      standard for aluminum production.
    needs:
    - electrolysis
    - representative_elements
    tier: 2
    source_domain: chemistry_ch18
  haber_process:
    defines: The industrial synthesis of ammonia by combining nitrogen and hydrogen
      gases over an iron catalyst at high temperature and pressure, the principal
      source of fixed nitrogen for fertilizers.
    needs:
    - nitrogen_fixation
    tier: 2
    source_domain: chemistry_ch18
  frasch_process:
    defines: A method for extracting elemental sulfur from underground deposits by
      injecting superheated water to melt the sulfur and compressed air to force the
      liquid sulfur to the surface.
    needs:
    - allotropes
    tier: 2
    source_domain: chemistry_ch18
  downs_cell:
    defines: An electrolytic cell used to produce metallic sodium and chlorine gas
      by passing direct current through molten sodium chloride containing calcium
      chloride to lower the melting point.
    needs:
    - electrolysis
    - alkali_metals
    tier: 3
    source_domain: chemistry_ch18
  pidgeon_process:
    defines: A chemical reduction method for producing magnesium by reacting magnesium
      oxide with elemental silicon at high temperature, with continuous removal of
      magnesium vapor driving the reaction forward.
    needs:
    - chemical_reduction_metals
    - alkaline_earth_metals
    tier: 3
    source_domain: chemistry_ch18
  chlor_alkali_process:
    defines: An electrochemical process that simultaneously produces chlorine gas
      and sodium hydroxide by passing direct current through an aqueous sodium chloride
      solution.
    needs:
    - electrolysis
    - halogens
    tier: 3
    source_domain: chemistry_ch18
  ostwald_process:
    defines: The industrial production of nitric acid by the catalytic oxidation of
      ammonia to NO, further oxidation to NO2, and absorption in water.
    needs:
    - haber_process
    - oxyacids
    tier: 4
    source_domain: chemistry_ch18
  transition_metal_catalysts:
    defines: The industrial application of transition metals as catalysts in manufacturing
      processes, enabled by their ability to adopt multiple oxidation states and bind
      ligands.
    needs:
    - transition_metal_oxidation_states
    - coordination_compound
    tier: 4
    source_domain: chemistry_ch19
  high_temperature_superconductors:
    defines: Transition metal oxide compounds, such as YBa2Cu3O7, that conduct electricity
      with zero resistance at temperatures achievable with liquid nitrogen cooling.
    needs:
    - transition_metal_compounds
    tier: 4
    source_domain: chemistry_ch19
  hemoglobin_oxygen_transport:
    defines: The biological application of coordination chemistry in which iron(II)
      within the heme chelate of hemoglobin reversibly binds oxygen for transport
      in the blood.
    needs:
    - chelate
    - crystal_field_theory
    tier: 5
    source_domain: chemistry_ch19
  chelation_therapy:
    defines: The medical use of polydentate ligands such as BAL, enterobactin, and
      DMSA to form water-soluble chelates with toxic heavy metals or excess iron,
      enabling their elimination from the body.
    needs:
    - chelate
    tier: 5
    source_domain: chemistry_ch19
  cisplatin_anticancer:
    defines: The square-planar cis-diamminedichloroplatinum(II) coordination compound
      used to treat cancer by inhibiting cell division, with only the cis isomer being
      therapeutically active.
    needs:
    - geometric_isomers
    tier: 7
    source_domain: chemistry_ch19
  combustion_of_alkanes:
    defines: The exothermic oxidation of alkanes with oxygen to yield carbon dioxide
      and water, making hydrocarbons such as methane, propane, and octane valuable
      as fuels.
    needs:
    - alkane
    tier: 3
    source_domain: chemistry_ch20
  fractional_distillation:
    defines: An industrial separation process that exploits boiling-point differences
      among alkane mixtures in crude oil to isolate fractions such as gasoline, kerosene,
      and diesel fuel.
    needs:
    - alkane
    tier: 3
    source_domain: chemistry_ch20
  polymerization:
    defines: A reaction in which many small monomer molecules containing double bonds
      (e.g., ethylene) link together to form high-molecular-mass polymer chains (e.g.,
      polyethylene) used as plastics.
    needs:
    - alkene
    - addition_reaction
    tier: 4
    source_domain: chemistry_ch20
  esterification:
    defines: The reaction of a carboxylic acid with an alcohol to produce an ester
      and water, responsible for the flavors and fragrances of fruits and used in
      the synthesis of fats and oils.
    needs:
    - carboxylic_acid
    - alcohol
    - ester
    tier: 7
    source_domain: chemistry_ch20
  amidation:
    defines: The condensation reaction between a carboxylic acid and an amine to form
      an amide bond with loss of water, the same reaction by which amino acids polymerize
      to form proteins in biological systems.
    needs:
    - carboxylic_acid
    - amine
    - amide
    tier: 7
    source_domain: chemistry_ch20
  radioactive_tracer:
    defines: A radioisotope incorporated into a compound to track its movement, distribution,
      or metabolic pathway in biological or chemical systems by detecting emitted
      radiation.
    needs:
    - radioactive_decay
    - ionizing_radiation
    tier: 8
    source_domain: chemistry_ch21
  radiation_therapy:
    defines: Medical treatment of cancer using high-energy ionizing radiation (delivered
      externally or via internal radioisotopes) to damage cancer cell DNA and prevent
      their proliferation.
    needs:
    - ionizing_radiation
    - radiation_biological_effects
    tier: 5
    source_domain: chemistry_ch21
  pet_scan:
    defines: A medical imaging technique that uses a positron-emitting radioisotope
      attached to a metabolically active molecule to produce three-dimensional functional
      images of tissues and organs.
    needs:
    - positron_emission
    - radioactive_tracer
    tier: 9
    source_domain: chemistry_ch21
  fission_power_generation:
    defines: The application of controlled fission chain reactions in a nuclear reactor
      to generate heat, produce steam, and drive turbines for electricity production.
    needs:
    - nuclear_reactor
    tier: 9
    source_domain: chemistry_ch21
  radiation_detection:
    defines: Devices including Geiger counters, scintillation counters, and dosimeters
      that detect and quantify ionizing radiation by measuring ionization events or
      emitted light.
    needs:
    - ionizing_radiation
    - radiation_units
    tier: 9
    source_domain: chemistry_ch21
  uranium_lead_dating:
    defines: A radiometric dating method using the known decay of U-238 to Pb-206
      (half-life 4.5 × 10⁹ years) to determine the age of rocks and minerals on geological
      timescales.
    needs:
    - radiometric_dating
    - isotope
    tier: 12
    source_domain: chemistry_ch21
